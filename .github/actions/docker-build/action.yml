name: Docker Build
description: Build (and optionally push) a Docker image to a container registry.

inputs:
  push:
    description: Whether to push the image to the registry
    required: false
    default: 'false'
  registry:
    description: Container registry hostname
    required: false
    default: ghcr.io
  image-name:
    description: Image name without registry prefix
    required: true
  tags:
    description: Newline-separated list of tags to apply
    required: true
  token:
    description: GITHUB_TOKEN or PAT for registry login
    required: true
  username:
    description: Registry username; defaults to github.actor when omitted
    required: false
    default: ''

outputs:
  tags:
    description: Docker image tags generated by the metadata step
    value: ${{ steps.meta.outputs.tags }}
  labels:
    description: Docker image labels generated by the metadata step
    value: ${{ steps.meta.outputs.labels }}
  json:
    description: JSON representation of all tags and labels from the metadata step
    value: ${{ steps.meta.outputs.json }}

runs:
  using: composite
  steps:
    - name: Log in to registry
      if: inputs.push == 'true'
      uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username || github.actor }}
        password: ${{ inputs.token }}

    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
      with:
        images: ${{ inputs.registry }}/${{ inputs.image-name }}
        tags: ${{ inputs.tags }}

    - name: Build and push Docker image
      uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
      with:
        context: .
        file: Dockerfile
        push: ${{ inputs.push == 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
