name: Build Stage
description: Restore cache, conditionally build, clean build outputs before caching, and conditionally save cache for a toolchain build stage.

inputs:
  stage-name:
    description: Human-readable display name for the build stage (e.g. binutils)
    required: true
  cache-paths:
    description: Multiline string of paths to cache (passed to actions/cache path:)
    required: true
  cache-key:
    description: Fully-resolved cache key string (caller computes the key)
    required: true
  build-script:
    description: Build script path (e.g. ./build-binutils.sh)
    required: true
  build-args:
    description: Additional arguments to pass to the build script
    required: false
    default: '--skip_steps=mingw,mingw-gdb-with-python,gdb-with-python,manual,package_sources'
  pre-cache-hit:
    description: >
      Cache-hit result from a preceding inline restore step in the caller.
      When provided, the action skips its internal restore step and uses this
      value to gate the build and save steps. This preserves the warm-cache
      optimisation where expensive runner setup is gated on an early cache
      check before calling this action. Omit (or leave empty) to have the
      action perform the restore itself.
    required: false
    default: ''
  save-in-merge-group:
    description: >
      When 'true', save the cache even during merge_group runs. Set this for
      stages whose cached output is consumed by downstream jobs in the same
      workflow run (e.g. binutils, which feeds build-gcc-first and build-gdb).
      Defaults to 'false' to preserve the default behaviour of skipping cache
      saves in merge_group events.
    required: false
    default: 'false'

outputs:
  cache-hit:
    description: Whether a cache hit occurred for this stage
    value: "${{ steps.set-output.outputs.cache-hit }}"
  build-time-seconds:
    description: Wall-clock seconds elapsed during the build stage (empty on cache hit)
    value: "${{ steps.build.outputs.build-time-seconds }}"

runs:
  using: composite
  steps:
    - name: Restore cache – ${{ inputs.stage-name }}
      id: restore
      if: inputs.pre-cache-hit == ''
      uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      with:
        path: ${{ inputs.cache-paths }}
        key: ${{ inputs.cache-key }}

    - name: Compute cache-miss – ${{ inputs.stage-name }}
      id: check
      shell: bash
      env:
        PRE_CACHE_HIT: ${{ inputs.pre-cache-hit }}
        RESTORE_CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
      run: "${GITHUB_ACTION_PATH}/compute-cache-miss.sh"

    - name: Set cache-hit output – ${{ inputs.stage-name }}
      id: set-output
      shell: bash
      env:
        CACHE_MISS: ${{ steps.check.outputs.cache-miss }}
      run: "${GITHUB_ACTION_PATH}/set-cache-hit-output.sh"

    - name: Build stage – ${{ inputs.stage-name }}
      id: build
      if: steps.check.outputs.cache-miss == 'true'
      shell: bash
      env:
        BUILD_STAGE_SCRIPT: ${{ inputs.build-script }}
        BUILD_STAGE_ARGS: ${{ inputs.build-args }}
      run: "${GITHUB_ACTION_PATH}/run-build-stage.sh"

    - name: Clean before cache save – ${{ inputs.stage-name }}
      if: steps.check.outputs.cache-miss == 'true'
      shell: bash
      env:
        CACHE_PATHS: ${{ inputs.cache-paths }}
      run: |
        set -euo pipefail
        while IFS= read -r cache_path; do
          [[ -z "$cache_path" ]] && continue
          "${GITHUB_WORKSPACE}/build-pre-cache-clean.sh" "${cache_path}"
        done <<< "$CACHE_PATHS"

    - name: Save cache – ${{ inputs.stage-name }}
      if: steps.check.outputs.cache-miss == 'true' && (github.event_name != 'merge_group' || inputs.save-in-merge-group == 'true')
      uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      with:
        path: ${{ inputs.cache-paths }}
        key: ${{ inputs.cache-key }}
