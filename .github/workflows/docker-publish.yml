name: Docker Publish

on:
  push:
    branches:
      - 13.3.rel1
  release:
    types:
      - published
  workflow_dispatch:

permissions: {}

jobs:
  docker-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Compute source tree hashes
        id: src-hashes
        uses: ./.github/actions/compute-toolchain-src-hash

      - name: Restore cache – toolchain
        id: cache-toolchain
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: install-native
          # Same key formula as build-toolchain.yml so this workflow always
          # finds the cache entry written by the toolchain build.
          key: ${{ runner.os }}-toolchain-v3-${{ hashFiles('build-*.sh') }}-${{ steps.src-hashes.outputs.toolchain-src }}

      - name: Check toolchain cache hit
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          echo "ERROR: Toolchain cache was not found." >&2
          echo "Run the 'Build STM32 Toolchain' workflow on this branch first to populate the cache." >&2
          exit 1

      - name: Compute image name
        id: image-name
        run: |
          branch="${{ github.event.repository.default_branch }}"
          safe_branch="${branch//\//-}"
          echo "value=stm32-toolchain-${safe_branch}" >> "${GITHUB_OUTPUT}"

      - name: Log in to registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image (no push)
        id: docker-build
        uses: ./.github/actions/docker-build
        with:
          push: 'false'
          load: 'true'
          image-name: ${{ steps.image-name.outputs.value }}
          tags: |
            type=raw,value=edge,enable=${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=semver,pattern=v{{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern=v{{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern=v{{major}},enable=${{ github.event_name == 'release' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image reference
        id: image-ref
        run: |
          IMAGE=$(echo "${{ steps.docker-build.outputs.tags }}" | head -1)
          if [[ -z "${IMAGE}" ]]; then
            echo "ERROR: No image tags were generated by the build step." >&2
            exit 1
          fi
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"

      - name: Validate toolchain – version check
        run: |
          docker run --rm --pull=never "${{ steps.image-ref.outputs.image }}" arm-none-eabi-gcc --version

      - name: Validate toolchain – build test_project
        run: |
          # cmake is not installed in the minimal runtime image (the Dockerfile
          # only includes libncurses6, libexpat1, and zlib1g).  We install cmake
          # and make transiently inside the container using apt-get so the image
          # itself stays lean; --rm discards the layer after the run completes.
          docker run --rm --pull=never \
            -v "${{ github.workspace }}/test_project:/work" \
            -w /work \
            "${{ steps.image-ref.outputs.image }}" \
            bash -c "apt-get update -qq \
              && apt-get install -y --no-install-recommends cmake make \
              && cmake -G 'Unix Makefiles' \
                -DCMAKE_TOOLCHAIN_FILE=/work/arm-none-eabi-gcc.cmake \
                -DCMAKE_C_COMPILER=arm-none-eabi-gcc \
                -DCMAKE_CXX_COMPILER=arm-none-eabi-g++ \
                -B /work/build -S /work \
              && cmake --build /work/build -- -j\$(nproc)"

      - name: Push Docker image
        run: |
          echo "${{ steps.docker-build.outputs.tags }}" | while IFS= read -r tag; do
            [ -n "$tag" ] && docker push "$tag" || exit 1
          done
