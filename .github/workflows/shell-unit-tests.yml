name: Shell Script Unit Tests

on:
  push:
    branches:
      - 13.3.rel1
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

jobs:
  check-changes:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should-test: ${{ steps.filter.outputs.test || 'true' }}
    steps:
      - name: Check for test-relevant file changes
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            test:
              - 'build-binutils.sh'
              - 'build-common.sh'
              - 'build-gcc-first.sh'
              - 'build-gdb.sh'
              - 'build-newlib.sh'
              - 'build-newlib-nano.sh'
              - 'build-prerequisites.sh'
              - 'build-toolchain.sh'
              - 'build-toolchain-args.sh'
              - 'tests/**'
              - '.github/workflows/shell-unit-tests.yml'
              - '.github/actions/build-stage/action.yml'
              - '.yamllint'

  shell-unit-tests:
    needs: check-changes
    if: needs.check-changes.outputs.should-test == 'true'
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install yamllint
        run: python3 -m pip install yamllint==1.38.0

      - name: Run shell unit tests
        run: |
          bash tests/test-build-common.sh
          bash tests/test-build-toolchain-args.sh
          bash tests/test-strip-binary.sh
          bash tests/test-build-stage-action.sh

  shell-unit-tests-status:
    runs-on: ubuntu-slim
    needs: [check-changes, shell-unit-tests]
    if: always()
    steps:
      - name: Report test status
        run: |
          if [[ "${{ needs.check-changes.result }}" == "failure" || "${{ needs.check-changes.result }}" == "cancelled" ]]; then
            echo "check-changes job failed or was cancelled" && exit 1
          fi
          if [[ "${{ needs.shell-unit-tests.result }}" == "failure" || "${{ needs.shell-unit-tests.result }}" == "cancelled" ]]; then
            echo "Tests failed or were cancelled" && exit 1
          fi
          echo "Tests skipped or succeeded"
