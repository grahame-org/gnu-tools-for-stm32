name: Shell Script Unit Tests

on:
  push:
    branches:
      - 13.3.rel1
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

jobs:
  check-changes:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should-test: ${{ steps.filter.outputs.test || 'true' }}
    steps:
      - name: Check for test-relevant file changes
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            test:
              - 'build-binutils.sh'
              - 'build-cache-budget-check.sh'
              - 'build-common.sh'
              - 'build-gcc-first.sh'
              - 'build-gdb.sh'
              - 'build-newlib.sh'
              - 'build-newlib-nano.sh'
              - 'build-pre-cache-clean.sh'
              - 'build-prerequisites.sh'
              - 'build-toolchain.sh'
              - 'build-toolchain-args.sh'
              - 'measure-cache-compressed-size.sh'
              - 'merge-gcc-final.sh'
              - 'docker-action/entrypoint.sh'
              - 'tests/**'
              - '.github/workflows/build-toolchain.yml'
              - '.github/workflows/shell-unit-tests.yml'
              - '.github/actions/build-stage/action.yml'
              - '.github/actions/build-stage/*.sh'
              - '.yamllint'

  shell-unit-tests:
    needs: check-changes
    if: needs.check-changes.outputs.should-test == 'true'
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install test dependencies
        run: |
          TEST_VENV_PATH=/opt/test-venv
          python3 -m venv "${TEST_VENV_PATH}"
          "${TEST_VENV_PATH}/bin/python3" -m pip install -r tests/requirements.txt
          echo "${TEST_VENV_PATH}/bin" >> "${GITHUB_PATH}"

      - name: Run shell unit tests
        run: |
          bash tests/test-build-cache-budget-check.sh
          bash tests/test-build-common.sh
          bash tests/test-build-prerequisites.sh
          bash tests/test-build-stage-action.sh
          bash tests/test-build-stage-scripts.sh
          bash tests/test-build-toolchain.sh
          bash tests/test-build-toolchain-args.sh
          bash tests/test-build-toolchain-cache-keys.sh
          bash tests/test-compute-toolchain-src-hash.sh
          bash tests/test-measure-cache-compressed-size.sh
          bash tests/test-merge-gcc-final.sh
          bash tests/test-entrypoint.sh
          bash tests/test-compare-test-project-artifacts.sh
          bash tests/test-pre-cache-clean.sh
          bash tests/test-strip-binary.sh

  shell-unit-tests-status:
    runs-on: ubuntu-slim
    needs: [check-changes, shell-unit-tests]
    if: always()
    steps:
      - name: Report test status
        run: |
          if [[ "${{ needs.check-changes.result }}" == "failure" || "${{ needs.check-changes.result }}" == "cancelled" ]]; then
            echo "check-changes job failed or was cancelled" && exit 1
          fi
          if [[ "${{ needs.shell-unit-tests.result }}" == "failure" || "${{ needs.shell-unit-tests.result }}" == "cancelled" ]]; then
            echo "Tests failed or were cancelled" && exit 1
          fi
          echo "Tests skipped or succeeded"
