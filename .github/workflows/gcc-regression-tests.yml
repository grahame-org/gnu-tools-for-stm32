name: GCC Regression Tests

on:
  push:
    branches:
      - 13.3.rel1
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  gcc-regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            yacc \
            flex \
            git \
            dejagnu \
            texinfo \
            automake \
            gcc \
            g++ \
            binutils \
            gcc-arm-none-eabi

      # Caching strategy: the host prerequisite libraries (gmp, mpfr, mpc, isl, expat,
      # zlib) are cached with a key based on their source file hashes. The same cache
      # key is used by build-toolchain.yml, allowing these two workflows to share the
      # pre-built host libraries and avoid redundant builds.
      - name: Cache build prerequisites
        id: cache-prerequisites
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: build-native/host-libs
          key: ${{ runner.os }}-prerequisites-${{ hashFiles('build-prerequisites.sh', 'build-common.sh', 'src/gmp/**', 'src/mpfr/**', 'src/mpc/**', 'src/isl/**', 'src/expat/**', 'src/zlib*/**') }}

      - name: Build prerequisites
        if: steps.cache-prerequisites.outputs.cache-hit != 'true'
        run: |
          export JOBS=$(nproc)
          ./build-prerequisites.sh --skip_steps=mingw,howto,package_sources

      # Caching strategy: the GCC build directory is cached with a key based on GCC
      # and newlib source file hashes. On a cache hit the configure and build steps are
      # skipped, and regression tests run directly against the cached build directory.
      # This avoids rebuilding GCC from scratch when its source has not changed.
      # The full toolchain (install-native/) is separately cached by build-toolchain.yml
      # and shared with workflows that need the complete installed cross-compilation tools.
      - name: Cache GCC build
        id: cache-gcc-build
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: build/gcc
          key: ${{ runner.os }}-gcc-build-${{ hashFiles('src/gcc/**', 'src/newlib/**') }}
          restore-keys: |
            ${{ runner.os }}-gcc-build-

      - name: Configure GCC
        if: steps.cache-gcc-build.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/gcc
          cd build/gcc
          ../../src/gcc/configure \
            --target=arm-none-eabi \
            --disable-nls \
            --disable-werror \
            --enable-languages=c,c++ \
            --enable-interwork \
            --with-newlib \
            --with-headers=../../src/newlib/newlib/libc/include \
            --with-gmp=../../build-native/host-libs/usr \
            --with-mpfr=../../build-native/host-libs/usr \
            --with-mpc=../../build-native/host-libs/usr \
            --with-isl=../../build-native/host-libs/usr

      - name: Build GCC
        if: steps.cache-gcc-build.outputs.cache-hit != 'true'
        run: make -C build/gcc -j$(nproc) all-gcc

      - name: Run GCC regression tests
        run: |
          rc=0
          make -C build/gcc check-gcc RUNTESTFLAGS="--target_board=arm-none-eabi-sim" || rc=$((rc | $?))
          exit $rc

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: gcc-test-results
          path: |
            build/gcc/**/*.sum
            build/gcc/**/*.log
