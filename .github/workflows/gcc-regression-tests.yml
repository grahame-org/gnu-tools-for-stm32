name: GCC Regression Tests

on:
  push:
    branches:
      - 13.3.rel1
  pull_request:
  workflow_dispatch:
    inputs:
      runtestflags:
        description: 'RUNTESTFLAGS value to scope the GCC test run (e.g. "execute.exp")'
        required: false
        default: 'execute.exp'
      unexpected_failures_threshold:
        description: 'Maximum number of unexpected failures allowed before the workflow fails'
        required: false
        default: '0'

permissions: {}

jobs:
  gcc-regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      RUNTESTFLAGS: ${{ github.event.inputs.runtestflags || 'execute.exp' }}
      UNEXPECTED_FAILURES_THRESHOLD: ${{ github.event.inputs.unexpected_failures_threshold || '0' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo apt-get remove -y \
            '^dotnet-.*' \
            '^llvm-.*' \
            'php.*' \
            azure-cli \
            google-chrome-stable \
            firefox \
            powershell \
            mono-devel \
            || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            yacc \
            flex \
            gcc-arm-none-eabi \
            gdb-multiarch \
            cmake \
            git \
            openocd \
            python3 \
            python3-pip \
            python3-venv \
            texi2html \
            texinfo \
            automake \
            dejagnu \
            qemu-system-arm
          for version in 1.15 1.14; do
            for tool in aclocal automake; do
              target="/usr/bin/${tool}-1.16"
              link="/usr/bin/${tool}-${version}"
              if [ -e "$link" ] || [ -L "$link" ]; then
                if [ "$(readlink -f "$link" 2>/dev/null || echo "")" != "$target" ]; then
                  echo "ERROR: $link already exists and does not point to $target" >&2
                  exit 1
                fi
              else
                sudo ln -s "$target" "$link"
              fi
            done
          done

      - name: Set up Python virtual environment
        run: |
          STM32_VENV_PATH=/opt/stm32-venv
          sudo mkdir -p "${STM32_VENV_PATH}"
          sudo chown "$USER" "${STM32_VENV_PATH}"
          python3 -m venv "${STM32_VENV_PATH}"
          "${STM32_VENV_PATH}/bin/python3" -m pip install python-magic==0.4.27
          echo "${STM32_VENV_PATH}/bin" >> "${GITHUB_PATH}"
          echo "STM32_VENV_PATH=${STM32_VENV_PATH}" >> "${GITHUB_ENV}"

      - name: Cache build prerequisites
        id: cache-prerequisites
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: build-native/host-libs
          key: ${{ runner.os }}-prerequisites-${{ hashFiles('build-prerequisites.sh', 'build-common.sh', 'src/gmp/**', 'src/mpfr/**', 'src/mpc/**', 'src/isl/**', 'src/expat/**', 'src/zlib*/**') }}

      - name: Build prerequisites
        if: steps.cache-prerequisites.outputs.cache-hit != 'true'
        run: |
          export JOBS=$(nproc)
          ./build-prerequisites.sh --skip_steps=mingw,howto,package_sources

      - name: Build toolchain
        run: |
          export JOBS=$(nproc)
          ./build-toolchain.sh --skip_steps=mingw,manual,package_sources,strip,gdb-with-python

      - name: Install DejaGnu board and QEMU wrapper
        run: |
          # Install custom board file so DejaGnu can find arm-none-eabi-sim
          sudo cp .github/boards/arm-none-eabi-sim.exp /usr/share/dejagnu/baseboards/
          # Install QEMU wrapper so it is on PATH as arm-none-eabi-run
          sudo cp .github/scripts/arm-none-eabi-run /usr/local/bin/arm-none-eabi-run
          sudo chmod +x /usr/local/bin/arm-none-eabi-run

      - name: Run GCC regression tests
        run: |
          pushd build-native/gcc-final
          make -j$(nproc) check-gcc \
            RUNTESTFLAGS="${RUNTESTFLAGS} --target_board=arm-none-eabi-sim" \
            || true
          popd

      - name: Check for unexpected test failures
        run: |
          sum_files=$(find build-native/gcc-final -name "*.sum" 2>/dev/null)
          if [ -z "$sum_files" ]; then
            echo "ERROR: No .sum files found. Tests may not have run." >&2
            exit 1
          fi

          unexpected_failures=0
          for sum_file in $sum_files; do
            count=$(grep -c "^FAIL:\|^XPASS:\|^ERROR:" "$sum_file" 2>/dev/null || true)
            unexpected_failures=$((unexpected_failures + count))
          done

          echo "Unexpected failures: ${unexpected_failures}"
          echo "Threshold: ${UNEXPECTED_FAILURES_THRESHOLD}"

          if [ "${unexpected_failures}" -gt "${UNEXPECTED_FAILURES_THRESHOLD}" ]; then
            echo "ERROR: Unexpected failures (${unexpected_failures}) exceed threshold (${UNEXPECTED_FAILURES_THRESHOLD})" >&2
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: gcc-test-results
          path: |
            build-native/gcc-final/**/*.sum
            build-native/gcc-final/**/*.log
          if-no-files-found: warn
          retention-days: 30
