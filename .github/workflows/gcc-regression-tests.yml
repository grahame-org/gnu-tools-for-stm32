name: GCC Regression Tests

# Caching strategy:
#
# This workflow reuses the toolchain build artifacts cached by build-toolchain.yml,
# avoiding a full 6-hour rebuild when the source files have not changed.
#
# Two caches are restored using the same keys as build-toolchain.yml:
#
#   1. Prerequisites (build-native/host-libs) — restored from the same key used in
#      build-toolchain.yml's "Cache build prerequisites" step.
#
#   2. Built toolchain install prefix (install-native) — restored from the same key
#      used in build-toolchain.yml's "Cache toolchain build" step.
#
# If either cache misses (e.g. source files changed), the corresponding build step
# runs to produce the artifacts, which are then saved for future workflow runs.
#
# In addition, the GCC test build directory (build/gcc-test) is cached separately
# using a key that includes both the GCC source hash and the toolchain cache key.
# This avoids reconfiguring and rebuilding GCC for testing when neither the GCC
# sources nor the installed toolchain have changed.

on:
  push:
    branches:
      - 13.3.rel1
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  gcc-regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo apt-get remove -y \
            '^dotnet-.*' \
            '^llvm-.*' \
            'php.*' \
            azure-cli \
            google-chrome-stable \
            firefox \
            powershell \
            mono-devel \
            || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            yacc \
            flex \
            gcc-arm-none-eabi \
            gdb-multiarch \
            cmake \
            git \
            dejagnu \
            qemu-system-arm \
            python3 \
            python3-pip \
            python3-venv \
            texi2html \
            texinfo \
            automake
          for version in 1.15 1.14; do
            for tool in aclocal automake; do
              target="/usr/bin/${tool}-1.16"
              link="/usr/bin/${tool}-${version}"
              if [ -e "$link" ] || [ -L "$link" ]; then
                if [ "$(readlink -f "$link" 2>/dev/null || echo "")" != "$target" ]; then
                  echo "ERROR: $link already exists and does not point to $target" >&2
                  exit 1
                fi
              else
                sudo ln -s "$target" "$link"
              fi
            done
          done

      - name: Set up Python virtual environment
        run: |
          STM32_VENV_PATH=/opt/stm32-venv
          sudo mkdir -p "${STM32_VENV_PATH}"
          sudo chown "$USER" "${STM32_VENV_PATH}"
          python3 -m venv "${STM32_VENV_PATH}"
          "${STM32_VENV_PATH}/bin/python3" -m pip install python-magic==0.4.27
          echo "${STM32_VENV_PATH}/bin" >> "${GITHUB_PATH}"
          echo "STM32_VENV_PATH=${STM32_VENV_PATH}" >> "${GITHUB_ENV}"

      - name: Cache build prerequisites
        id: cache-prerequisites
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: build-native/host-libs
          key: ${{ runner.os }}-prerequisites-${{ hashFiles('build-prerequisites.sh', 'build-common.sh', 'src/gmp/**', 'src/mpfr/**', 'src/mpc/**', 'src/isl/**', 'src/expat/**', 'src/zlib*/**') }}

      - name: Build prerequisites
        if: steps.cache-prerequisites.outputs.cache-hit != 'true'
        run: |
          export JOBS=$(nproc)
          ./build-prerequisites.sh --skip_steps=mingw,howto,package_sources

      - name: Cache toolchain build
        id: cache-toolchain
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: install-native
          key: ${{ runner.os }}-toolchain-${{ hashFiles('build-toolchain.sh', 'build-common.sh', 'src/binutils/**', 'src/gcc/**', 'src/gdb/**', 'src/newlib/**', 'src/libiconv/**', 'src/liblongpath-win32/**', 'src/specs/**') }}-${{ hashFiles('build-prerequisites.sh', 'build-common.sh', 'src/gmp/**', 'src/mpfr/**', 'src/mpc/**', 'src/isl/**', 'src/expat/**', 'src/zlib*/**') }}

      - name: Build toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          export JOBS=$(nproc)
          ./build-toolchain.sh --skip_steps=mingw,mingw-gdb-with-python,gdb-with-python,manual,package_sources

      - name: Cache GCC test build
        id: cache-gcc-test
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: build/gcc-test
          key: ${{ runner.os }}-gcc-test-${{ hashFiles('src/gcc/**') }}-${{ hashFiles('build-toolchain.sh', 'build-common.sh', 'src/binutils/**', 'src/gcc/**', 'src/gdb/**', 'src/newlib/**', 'src/libiconv/**', 'src/liblongpath-win32/**', 'src/specs/**') }}-${{ hashFiles('build-prerequisites.sh', 'build-common.sh', 'src/gmp/**', 'src/mpfr/**', 'src/mpc/**', 'src/isl/**', 'src/expat/**', 'src/zlib*/**') }}

      - name: Configure GCC for testing
        if: steps.cache-gcc-test.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/gcc-test
          cd build/gcc-test
          ../../src/gcc/configure \
            --target=arm-none-eabi \
            --prefix="${GITHUB_WORKSPACE}/install-native" \
            --with-sysroot="${GITHUB_WORKSPACE}/install-native/arm-none-eabi" \
            --with-as="${GITHUB_WORKSPACE}/install-native/bin/arm-none-eabi-as" \
            --with-ld="${GITHUB_WORKSPACE}/install-native/bin/arm-none-eabi-ld" \
            --enable-languages=c,c++ \
            --enable-checking=release \
            --disable-nls \
            --disable-werror \
            --disable-shared \
            --disable-threads \
            --disable-tls \
            --with-newlib \
            --with-gnu-as \
            --with-gnu-ld \
            --with-zstd=no

      - name: Build GCC for testing
        if: steps.cache-gcc-test.outputs.cache-hit != 'true'
        run: make -C build/gcc-test -j$(nproc) all-gcc

      - name: Run GCC regression tests
        run: |
          export PATH="${GITHUB_WORKSPACE}/install-native/bin:${PATH}"
          rc=0
          make -C build/gcc-test check-gcc \
            RUNTESTFLAGS="--target_board=arm-sim" || rc=$((rc | $?))
          exit $rc

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: gcc-test-results
          path: |
            build/gcc-test/**/*.sum
            build/gcc-test/**/*.log
