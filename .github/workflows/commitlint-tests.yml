name: Commitlint Tests

on:
  push:
    branches:
      - 13.3.rel1
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

jobs:
  check-changes:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should-test: ${{ steps.filter.outputs.test || 'true' }}
    steps:
      - name: Check for test-relevant file changes
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            test:
              - 'package.json'
              - 'package-lock.json'
              - 'commitlint.config.js'
              - '.github/workflows/commitlint-tests.yml'

  commitlint-tests:
    needs: check-changes
    if: needs.check-changes.outputs.should-test == 'true'
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate known-good conventional commit message
        run: |
          printf '%s\n' "feat: add support for ARMv9" | npx --no-install commitlint --verbose

      - name: Validate known-bad commit message is rejected
        run: |
          if printf '%s\n' "this is not a conventional commit" | npx --no-install commitlint --verbose; then
            echo "ERROR: commitlint accepted an invalid message — regression detected"
            exit 1
          fi
          echo "commitlint correctly rejected the invalid message"

  commitlint-tests-status:
    runs-on: ubuntu-slim
    needs: [check-changes, commitlint-tests]
    if: always()
    steps:
      - name: Report test status
        run: |
          if [[ "${{ needs.check-changes.result }}" == "failure" || "${{ needs.check-changes.result }}" == "cancelled" ]]; then
            echo "check-changes job failed or was cancelled" && exit 1
          fi
          if [[ "${{ needs.commitlint-tests.result }}" == "failure" || "${{ needs.commitlint-tests.result }}" == "cancelled" ]]; then
            echo "Tests failed or were cancelled" && exit 1
          fi
          echo "Tests skipped or succeeded"
