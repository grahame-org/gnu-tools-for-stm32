name: Test Docker Action

on:
  push:
    branches:
      - 13.3.rel1
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

jobs:
  check-changes:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should-test: ${{ steps.filter.outputs.test || 'true' }}
    steps:
      - name: Check for test-relevant file changes
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            test:
              - 'docker-action/**'
              - 'test_project/**'
              - 'Dockerfile'
              - '.github/actions/compare-test-project-artifacts/**'
              - '.github/actions/compute-toolchain-src-hash/**'
              - '.github/workflows/test-docker-action.yml'

  test-docker-action:
    needs: check-changes
    if: needs.check-changes.outputs.should-test == 'true'
    runs-on: ubuntu-latest
    # Timeout is set to the GitHub-hosted runner maximum (360 minutes).
    # The gh run watch step uses an explicit 350m timeout so the job always
    # exits cleanly before the runner cap is reached.
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Compute source tree hashes
        id: src-hashes
        uses: ./.github/actions/compute-toolchain-src-hash

      - name: Restore cache – toolchain
        id: cache-toolchain
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: install-native
          # Keep this cache key in sync with the key used in build-toolchain.yml.
          key: ${{ runner.os }}-toolchain-v3-${{ hashFiles('build-*.sh') }}-${{ steps.src-hashes.outputs.toolchain-src }}

      - name: Wait for toolchain build (on cache miss)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          branch="${HEAD_REF:-${REF_NAME}}"
          run_id=$(gh run list \
            --repo "${GH_REPO}" \
            --workflow=build-toolchain.yml \
            --branch="${branch}" \
            --json databaseId,status \
            --jq '[.[] | select(.status == "in_progress" or .status == "queued")] | .[0].databaseId // empty')
          if [[ -n "${run_id}" ]]; then
            echo "Found toolchain build run ${run_id} -- waiting for completion..."
            if ! timeout 350m gh run watch "${run_id}" \
                --repo "${GH_REPO}" \
                --exit-status \
                --interval 60; then
              echo "::warning::Timed out or failed waiting for toolchain build run ${run_id}. Validation steps will be skipped."
            fi
          else
            echo "::warning::No in-progress toolchain build found and cache is missing. Validation steps will be skipped."
          fi

      - name: Re-restore toolchain cache after build
        id: cache-toolchain-post-build
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: install-native
          key: ${{ runner.os }}-toolchain-v3-${{ hashFiles('build-*.sh') }}-${{ steps.src-hashes.outputs.toolchain-src }}

      - name: Build Docker image for testing
        if: >-
          steps.cache-toolchain.outputs.cache-hit == 'true' ||
          steps.cache-toolchain-post-build.outputs.cache-hit == 'true'
        run: |
          # Extract the image reference from docker-action/action.yml so this step
          # stays in sync automatically when release-please bumps the tag.
          # The pattern handles both single- and double-quoted image references.
          action_image=$(grep -oP 'docker://\K[^'"'"'"\s]+' docker-action/action.yml | head -1)
          docker build -t "${action_image}" .

      - name: Build test_project using docker-action
        if: >-
          steps.cache-toolchain.outputs.cache-hit == 'true' ||
          steps.cache-toolchain-post-build.outputs.cache-hit == 'true'
        uses: ./docker-action
        with:
          src-path: test_project

      - name: Compare test_project artifacts against reference binaries
        if: >-
          steps.cache-toolchain.outputs.cache-hit == 'true' ||
          steps.cache-toolchain-post-build.outputs.cache-hit == 'true'
        uses: ./.github/actions/compare-test-project-artifacts

  test-docker-action-status:
    runs-on: ubuntu-slim
    needs: [check-changes, test-docker-action]
    if: always()
    steps:
      - name: Report test status
        run: |
          if [[ "${{ needs.check-changes.result }}" == "failure" || "${{ needs.check-changes.result }}" == "cancelled" ]]; then
            echo "check-changes job failed or was cancelled" && exit 1
          fi
          if [[ "${{ needs.test-docker-action.result }}" == "failure" || "${{ needs.test-docker-action.result }}" == "cancelled" ]]; then
            echo "Tests failed or were cancelled" && exit 1
          fi
          echo "Tests skipped or succeeded"
