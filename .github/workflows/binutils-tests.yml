name: Binutils Regression Tests

on:
  push:
    branches:
      - 13.3.rel1
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

jobs:
  check-changes:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should-test: ${{ steps.filter.outputs.test || 'true' }}
    steps:
      - name: Check for test-relevant file changes
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            test:
              - 'src/binutils/**'
              - 'build-toolchain.sh'
              - 'build-prerequisites.sh'
              - 'build-common.sh'
              - '.github/workflows/binutils-tests.yml'

  binutils-tests:
    needs: check-changes
    if: needs.check-changes.outputs.should-test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            yacc \
            flex \
            git \
            dejagnu \
            texinfo \
            automake \
            gcc-arm-none-eabi

      - name: Configure binutils
        run: |
          mkdir -p build/binutils
          cd build/binutils
          ../../src/binutils/configure \
            --target=arm-none-eabi \
            --disable-nls \
            --disable-werror \
            --disable-sim \
            --disable-gdb \
            --enable-interwork \
            --enable-plugins \
            --with-zstd=no

      - name: Build binutils
        run: make -C build/binutils -j$(nproc)

      - name: Run binutils regression tests
        run: |
          rc=0
          make -C build/binutils check-gas || rc=$((rc | $?))
          make -C build/binutils check-ld || rc=$((rc | $?))
          make -C build/binutils check-binutils || rc=$((rc | $?))
          exit $rc

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: binutils-test-results
          path: |
            build/binutils/**/*.sum
            build/binutils/**/*.log

  binutils-tests-status:
    runs-on: ubuntu-slim
    needs: [check-changes, binutils-tests]
    if: always()
    steps:
      - name: Report test status
        run: |
          if [[ "${{ needs.check-changes.result }}" == "failure" || "${{ needs.check-changes.result }}" == "cancelled" ]]; then
            echo "check-changes job failed or was cancelled" && exit 1
          fi
          if [[ "${{ needs.binutils-tests.result }}" == "failure" || "${{ needs.binutils-tests.result }}" == "cancelled" ]]; then
            echo "Tests failed or were cancelled" && exit 1
          fi
          echo "Tests skipped or succeeded"
