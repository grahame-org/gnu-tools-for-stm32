name: Docker Dry-Run

on:
  push:
    branches:
      - 13.3.rel1
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

jobs:
  check-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should-build: ${{ steps.filter.outputs.build || 'true' }}
    steps:
      - name: Check for build-relevant file changes
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            build:
              - 'Dockerfile'
              - '.dockerignore'
              - '.github/workflows/docker-dry-run.yml'
              - '.github/actions/docker-build/**'
              - '.github/actions/compute-toolchain-src-hash/**'
              - 'docker-action/**'
              - 'test_project/**'

  docker-dry-run:
    needs: check-changes
    if: needs.check-changes.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    # Timeout is set to the GitHub-hosted runner maximum (360 minutes).
    # The gh run watch step uses an explicit 350m timeout so the job always
    # exits cleanly before the runner cap is reached.
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Compute source tree hashes
        id: src-hashes
        uses: ./.github/actions/compute-toolchain-src-hash

      - name: Restore cache – toolchain
        id: cache-toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: install-native
          # Same key formula as build-toolchain.yml so this workflow always
          # finds the cache entry written by the toolchain build.
          key: ${{ runner.os }}-toolchain-v3-${{ hashFiles('build-*.sh') }}-${{ steps.src-hashes.outputs.toolchain-src }}

      - name: Wait for toolchain build (on cache miss)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          branch="${HEAD_REF:-${REF_NAME}}"
          run_id=$(gh run list \
            --repo "${GH_REPO}" \
            --workflow=build-toolchain.yml \
            --branch="${branch}" \
            --json databaseId,status \
            --jq '[.[] | select(.status == "in_progress" or .status == "queued")] | .[0].databaseId // empty')
          if [[ -n "${run_id}" ]]; then
            echo "Found toolchain build run ${run_id} -- waiting for completion..."
            if ! timeout 350m gh run watch "${run_id}" \
                --repo "${GH_REPO}" \
                --exit-status \
                --interval 60; then
              echo "::warning::Timed out or failed waiting for toolchain build run ${run_id}. Validation steps will be skipped."
            fi
          else
            echo "::warning::No in-progress toolchain build found and cache is missing. Validation steps will be skipped."
          fi

      - name: Re-restore toolchain cache after build
        id: cache-toolchain-post-build
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: install-native
          key: ${{ runner.os }}-toolchain-v3-${{ hashFiles('build-*.sh') }}-${{ steps.src-hashes.outputs.toolchain-src }}

      - name: Compute image name
        id: image_name
        if: >-
          steps.cache-toolchain.outputs.cache-hit == 'true' ||
          steps.cache-toolchain-post-build.outputs.cache-hit == 'true'
        run: |
          safe_ref="${GITHUB_REF_NAME//\//-}"
          safe_ref="$(echo "${safe_ref}" | tr '[:upper:]' '[:lower:]')"
          echo "value=stm32-toolchain-${safe_ref}" >> "${GITHUB_OUTPUT}"

      - name: Build Docker image (no push)
        id: docker-build
        if: >-
          steps.cache-toolchain.outputs.cache-hit == 'true' ||
          steps.cache-toolchain-post-build.outputs.cache-hit == 'true'
        uses: ./.github/actions/docker-build
        with:
          push: 'false'
          image-name: ${{ steps.image_name.outputs.value }}
          tags: |
            type=sha
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image reference
        id: image-ref
        if: >-
          steps.cache-toolchain.outputs.cache-hit == 'true' ||
          steps.cache-toolchain-post-build.outputs.cache-hit == 'true'
        run: |
          IMAGE=$(echo "${{ steps.docker-build.outputs.tags }}" | head -1)
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"

      - name: Validate toolchain – version check
        if: >-
          steps.cache-toolchain.outputs.cache-hit == 'true' ||
          steps.cache-toolchain-post-build.outputs.cache-hit == 'true'
        run: |
          docker run --rm \
            --entrypoint arm-none-eabi-gcc \
            "${{ steps.image-ref.outputs.image }}" \
            --version

      - name: Validate toolchain – build test_project
        if: >-
          steps.cache-toolchain.outputs.cache-hit == 'true' ||
          steps.cache-toolchain-post-build.outputs.cache-hit == 'true'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/test_project:/work" \
            -w /work \
            "${{ steps.image-ref.outputs.image }}" \
            . # SOURCE_DIR='.': entrypoint runs cmake configure + build with BUILD_DIR=./build

  docker-dry-run-status:
    runs-on: ubuntu-latest
    needs: [check-changes, docker-dry-run]
    if: always()
    steps:
      - name: Report docker-dry-run status
        run: |
          if [[ "${{ needs.check-changes.result }}" == "failure" || "${{ needs.check-changes.result }}" == "cancelled" ]]; then
            echo "check-changes job failed or was cancelled" && exit 1
          fi
          if [[ "${{ needs.docker-dry-run.result }}" == "failure" || "${{ needs.docker-dry-run.result }}" == "cancelled" ]]; then
            echo "docker-dry-run failed or was cancelled" && exit 1
          fi
          echo "docker-dry-run skipped or succeeded"
