name: Docker Dry-Run

on:
  push:
    branches:
      - 13.3.rel1
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

jobs:
  check-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should-build: ${{ steps.filter.outputs.build || 'true' }}
    steps:
      - name: Check for build-relevant file changes
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            build:
              - 'Dockerfile'
              - '.dockerignore'
              - '.github/workflows/docker-dry-run.yml'
              - '.github/actions/docker-build/**'
              - 'test_project/**'

  docker-dry-run:
    needs: check-changes
    if: needs.check-changes.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Compute source tree hashes
        id: src-hashes
        uses: ./.github/actions/compute-toolchain-src-hash

      - name: Restore cache – toolchain
        id: cache-toolchain
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: install-native
          # Same key formula as build-toolchain.yml so this workflow always
          # finds the cache entry written by the toolchain build.
          key: ${{ runner.os }}-toolchain-v3-${{ hashFiles('build-*.sh') }}-${{ steps.src-hashes.outputs.toolchain-src }}

      - name: Check toolchain cache hit
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          echo "ERROR: Toolchain cache was not found." >&2
          echo "Run the 'Build STM32 Toolchain' workflow on this branch first to populate the cache." >&2
          exit 1

      - name: Build Docker image (no push)
        id: docker-build
        uses: ./.github/actions/docker-build
        with:
          push: 'false'
          image-name: ${{ github.repository }}
          tags: |
            type=sha
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image reference
        id: image-ref
        run: |
          IMAGE=$(echo "${{ steps.docker-build.outputs.tags }}" | head -1)
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"

      - name: Validate toolchain – version check
        run: |
          docker run --rm "${{ steps.image-ref.outputs.image }}" arm-none-eabi-gcc --version

      - name: Validate toolchain – build test_project
        run: |
          # cmake is not installed in the minimal runtime image (the Dockerfile
          # only includes libncurses6, libexpat1, and zlib1g).  We install cmake
          # and make transiently inside the container using apt-get so the image
          # itself stays lean; --rm discards the layer after the run completes.
          docker run --rm \
            -v "${{ github.workspace }}/test_project:/work" \
            -w /work \
            "${{ steps.image-ref.outputs.image }}" \
            bash -c "apt-get update -qq \
              && apt-get install -y --no-install-recommends cmake make \
              && cmake -G 'Unix Makefiles' \
                -DCMAKE_TOOLCHAIN_FILE=/work/arm-none-eabi-gcc.cmake \
                -DCMAKE_C_COMPILER=arm-none-eabi-gcc \
                -DCMAKE_CXX_COMPILER=arm-none-eabi-g++ \
                -B /work/build -S /work \
              && cmake --build /work/build -- -j\$(nproc)"

  docker-dry-run-status:
    runs-on: ubuntu-latest
    needs: [check-changes, docker-dry-run]
    if: always()
    steps:
      - name: Report docker-dry-run status
        run: |
          if [[ "${{ needs.check-changes.result }}" == "failure" || "${{ needs.check-changes.result }}" == "cancelled" ]]; then
            echo "check-changes job failed or was cancelled" && exit 1
          fi
          if [[ "${{ needs.docker-dry-run.result }}" == "failure" || "${{ needs.docker-dry-run.result }}" == "cancelled" ]]; then
            echo "docker-dry-run failed or was cancelled" && exit 1
          fi
          echo "docker-dry-run skipped or succeeded"
