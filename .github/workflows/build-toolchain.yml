          df -h

      - name: Install system dependencies
        if: steps.pre-restore.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            yacc \
            flex \
            gcc-arm-none-eabi \
            gdb-multiarch \
            cmake \
            git \
            openocd \
            python3 \
            python3-pip \
            python3-venv \
            texi2html \
            texinfo \
            automake
          for version in 1.15 1.14; do
            for tool in aclocal automake; do
              target="/usr/bin/${tool}-1.16"
              link="/usr/bin/${tool}-${version}"
              if [ -e "$link" ] || [ -L "$link" ]; then
