                  echo "ERROR: $link already exists and does not point to $target" >&2
                  exit 1
                fi
              else
                sudo ln -s "$target" "$link"
              fi
            done
          done

      - name: Set up Python virtual environment
        if: steps.pre-restore.outputs.cache-hit != 'true'
        run: |
          STM32_VENV_PATH=/opt/stm32-venv
          sudo mkdir -p "${STM32_VENV_PATH}"
          sudo chown "$USER" "${STM32_VENV_PATH}"
          python3 -m venv "${STM32_VENV_PATH}"
          "${STM32_VENV_PATH}/bin/python3" -m pip install python-magic==0.4.27
          echo "${STM32_VENV_PATH}/bin" >> "${GITHUB_PATH}"
          echo "STM32_VENV_PATH=${STM32_VENV_PATH}" >> "${GITHUB_ENV}"

      - name: Restore cache – prerequisites
        id: cache-prerequisites
        if: steps.pre-restore.outputs.cache-hit != 'true'
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: build-native/host-libs
          key: ${{ runner.os }}-prerequisites-${{ hashFiles('build-prerequisites.sh', 'build-common.sh', 'src/gmp/**', 'src/mpfr/**', 'src/mpc/**', 'src/isl/**', 'src/expat/**', 'src/zlib*/**') }}

      - name: Build prerequisites (cache miss)
        if: steps.cache-prerequisites.outputs.cache-hit != 'true' && steps.pre-restore.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          JOBS="${JOBS:-$(nproc)}"
          export JOBS
          ./build-prerequisites.sh --skip_steps=mingw,howto,package_sources

      # Restore gcc-first as the compiler needed to build newlib-nano
      - name: Restore cache – gcc-first
        if: steps.pre-restore.outputs.cache-hit != 'true'
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: install-native
          key: ${{ runner.os }}-stage-v2-${{ needs.compute-hashes.outputs['gcc-first'] }}

      - name: Build and cache stage – newlib-nano
        id: build-newlib-nano
        uses: ./.github/actions/build-stage
        with:
          stage-name: newlib-nano
          cache-paths: build-native/target-libs
          cache-key: ${{ runner.os }}-stage-v2-${{ needs.compute-hashes.outputs['newlib-nano'] }}
          build-script: ./build-newlib-nano.sh
          pre-cache-hit: ${{ steps.pre-restore.outputs.cache-hit == 'true' }}
          save-in-merge-group: 'true'

      - name: Report cache sizes – newlib-nano
        id: cache-sizes-newlib-nano
        if: always()
        run: |
          set -euo pipefail
          if [ -d build-native/target-libs ]; then
            size_human=$(du -sh build-native/target-libs | cut -f1)
            size_bytes=$(du -sb build-native/target-libs | cut -f1)
          else
            size_human="(not found)"
            size_bytes="0"
          fi
          {
            echo "| Stage | Path | Size |"
            echo "|-------|------|------|"
            echo "| newlib-nano | build-native/target-libs | ${size_human} |"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "cache-size-bytes=${size_bytes}" >> "${GITHUB_OUTPUT}"

  # ---------------------------------------------------------------------------
  # Job: build-gcc-final
  # GCC final compiler (stage III-4).  Depends on build-newlib.
  # ---------------------------------------------------------------------------
  build-gcc-final:
    needs: [check-changes, compute-hashes, build-newlib]
    if: needs.check-changes.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      gcc-final-build-time: ${{ steps.build-gcc-final.outputs.build-time-seconds }}
      gcc-final-cache-hit: ${{ steps.build-gcc-final.outputs.cache-hit }}
      gcc-final-cache-sizes: ${{ steps.cache-sizes-gcc-final.outputs.cache-size-bytes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Restore cache – gcc-final
        id: pre-restore
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: install-native
          key: ${{ runner.os }}-stage-v2-${{ needs.compute-hashes.outputs['gcc-final'] }}

      - name: Free disk space
        if: steps.pre-restore.outputs.cache-hit != 'true'
        run: |
          sudo apt-get remove -y \
            '^dotnet-.*' \
            '^llvm-.*' \
            'php.*' \
            azure-cli \
            google-chrome-stable \
            firefox \
            powershell \
            mono-devel \
            || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install system dependencies
        if: steps.pre-restore.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            yacc \
            flex \
            gcc-arm-none-eabi \
            gdb-multiarch \
            cmake \
            git \
            openocd \
            python3 \
            python3-pip \
            python3-venv \
            texi2html \
            texinfo \
            automake \
            ccache
          for version in 1.15 1.14; do
            for tool in aclocal automake; do
              target="/usr/bin/${tool}-1.16"
              link="/usr/bin/${tool}-${version}"
              if [ -e "$link" ] || [ -L "$link" ]; then
                if [ "$(readlink -f "$link" 2>/dev/null || echo "")" != "$target" ]; then
                  echo "ERROR: $link already exists and does not point to $target" >&2
                  exit 1
                fi
              else
                sudo ln -s "$target" "$link"
              fi
            done
          done

      - name: Set up Python virtual environment
        if: steps.pre-restore.outputs.cache-hit != 'true'
        run: |
          STM32_VENV_PATH=/opt/stm32-venv
          sudo mkdir -p "${STM32_VENV_PATH}"
          sudo chown "$USER" "${STM32_VENV_PATH}"
          python3 -m venv "${STM32_VENV_PATH}"
          "${STM32_VENV_PATH}/bin/python3" -m pip install python-magic==0.4.27
          echo "${STM32_VENV_PATH}/bin" >> "${GITHUB_PATH}"
          echo "STM32_VENV_PATH=${STM32_VENV_PATH}" >> "${GITHUB_ENV}"

      - name: Restore cache – prerequisites
        id: cache-prerequisites
        if: steps.pre-restore.outputs.cache-hit != 'true'
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: build-native/host-libs
          key: ${{ runner.os }}-prerequisites-${{ hashFiles('build-prerequisites.sh', 'build-common.sh', 'src/gmp/**', 'src/mpfr/**', 'src/mpc/**', 'src/isl/**', 'src/expat/**', 'src/zlib*/**') }}

      - name: Build prerequisites (cache miss)
        if: steps.cache-prerequisites.outputs.cache-hit != 'true' && steps.pre-restore.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          JOBS="${JOBS:-$(nproc)}"
          export JOBS
          ./build-prerequisites.sh --skip_steps=mingw,howto,package_sources

      - name: Restore cache – newlib
        if: steps.pre-restore.outputs.cache-hit != 'true'
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: install-native
          key: ${{ runner.os }}-stage-v2-${{ needs.compute-hashes.outputs.newlib }}

      - name: Restore ccache – gcc-final
        id: cache-gcc-final
        if: steps.pre-restore.outputs.cache-hit != 'true'
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-gcc-final-${{ needs.compute-hashes.outputs['gcc-final'] }}
          restore-keys: |
            ${{ runner.os }}-ccache-gcc-final-

      - name: Build and cache stage – gcc-final
        id: build-gcc-final
        uses: ./.github/actions/build-stage
        with:
          stage-name: gcc-final
          cache-paths: install-native
          cache-key: ${{ runner.os }}-stage-v2-${{ needs.compute-hashes.outputs['gcc-final'] }}
          build-script: ./build-gcc-final.sh
          pre-cache-hit: ${{ steps.pre-restore.outputs.cache-hit == 'true' }}
          save-in-merge-group: 'true'

      - name: Report cache sizes – gcc-final
        id: cache-sizes-gcc-final
        if: always()
        run: |
          set -euo pipefail
          if [ -d install-native ]; then
            size_human=$(du -sh install-native | cut -f1)
            size_bytes=$(du -sb install-native | cut -f1)
          else
