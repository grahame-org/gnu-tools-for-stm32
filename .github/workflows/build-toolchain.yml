          } >> "${GITHUB_STEP_SUMMARY}"
          echo "cache-size-bytes=${size_bytes}" >> "${GITHUB_OUTPUT}"

      - name: Check ccache directory – gcc-final
        id: check-ccache-gcc-final
        if: steps.pre-restore.outputs.cache-hit != 'true' && steps.cache-gcc-final.outputs.cache-hit != 'true' && github.event_name != 'merge_group'
        run: |
          if [ -d ~/.ccache ] && [ -n "$(ls -A ~/.ccache 2>/dev/null)" ]; then
            echo "non-empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "non-empty=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save ccache – gcc-final
        if: steps.check-ccache-gcc-final.outputs.non-empty == 'true'
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-gcc-final-${{ needs.compute-hashes.outputs['gcc-final'] }}

  # ---------------------------------------------------------------------------
  # Job: build-gcc-size-libstdcxx
  # GCC size-optimised libstdc++ (stage III-5).  Depends on build-gcc-final
  # (for install-native/) and build-newlib-nano (for build-native/target-libs/).
  # ---------------------------------------------------------------------------
  build-gcc-size-libstdcxx:
    needs: [check-changes, compute-hashes, build-gcc-final, build-newlib-nano]
