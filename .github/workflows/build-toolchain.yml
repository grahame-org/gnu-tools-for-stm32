name: Build STM32 Toolchain

on:
  push:
    branches:
      - 13.3.rel1
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

jobs:
  check-changes:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should-build: ${{ steps.filter.outputs.build || 'true' }}
    steps:
      - name: Check for build-relevant file changes
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            build:
              - 'src/**'
              - 'build-binutils.sh'
              - 'build-common.sh'
              - 'build-gcc-first.sh'
              - 'build-gcc-final.sh'
              - 'build-gcc-size-libstdcxx.sh'
              - 'build-gdb.sh'
              - 'build-newlib.sh'
              - 'build-newlib-nano.sh'
              - 'build-prerequisites.sh'
              - 'build-toolchain.sh'
              - 'build-toolchain-args.sh'
              - '.github/workflows/build-toolchain.yml'
              - '.github/actions/build-stage/**'
              - 'test_project/**'

  compute-hashes:
    needs: check-changes
    if: needs.check-changes.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      binutils: ${{ steps.stage-hashes.outputs.binutils }}
      gcc-first: ${{ steps.stage-hashes.outputs.gcc-first }}
      newlib: ${{ steps.stage-hashes.outputs.newlib }}
      newlib-nano: ${{ steps.stage-hashes.outputs.newlib-nano }}
      gcc-final: ${{ steps.stage-hashes.outputs.gcc-final }}
      gcc-size-libstdcxx: ${{ steps.stage-hashes.outputs.gcc-size-libstdcxx }}
      gdb: ${{ steps.stage-hashes.outputs.gdb }}
      final: ${{ steps.stage-hashes.outputs.final }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Restore cache – prerequisites
        id: cache-prerequisites
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: build-native/host-libs
          key: ${{ runner.os }}-prerequisites-${{ hashFiles('build-prerequisites.sh', 'build-common.sh', 'src/gmp/**', 'src/mpfr/**', 'src/mpc/**', 'src/isl/**', 'src/expat/**', 'src/zlib*/**') }}
          lookup-only: true

      - name: Compute stage source hashes
        id: stage-hashes
        run: |
          set -euo pipefail
          hash_dir() { git rev-parse "HEAD:$1"; }
          binutils_scripts_hash=$(
            printf '%s\n' \
              "$(hash_dir build-binutils.sh)" \
              "$(hash_dir build-toolchain-args.sh)" \
              "$(hash_dir build-common.sh)" \
            | sha256sum | cut -d' ' -f1
          )
          gcc_first_scripts_hash=$(
            printf '%s\n' \
              "$(hash_dir build-gcc-first.sh)" \
              "$(hash_dir build-toolchain-args.sh)" \
              "$(hash_dir build-common.sh)" \
            | sha256sum | cut -d' ' -f1
          )
          newlib_scripts_hash=$(
            printf '%s\n' \
              "$(hash_dir build-newlib.sh)" \
              "$(hash_dir build-toolchain-args.sh)" \
              "$(hash_dir build-common.sh)" \
            | sha256sum | cut -d' ' -f1
          )
          newlib_nano_scripts_hash=$(
            printf '%s\n' \
              "$(hash_dir build-newlib-nano.sh)" \
              "$(hash_dir build-toolchain-args.sh)" \
              "$(hash_dir build-common.sh)" \
            | sha256sum | cut -d' ' -f1
          )
          gcc_final_scripts_hash=$(
            printf '%s\n' \
              "$(hash_dir build-gcc-final.sh)" \
              "$(hash_dir build-toolchain-args.sh)" \
              "$(hash_dir build-common.sh)" \
            | sha256sum | cut -d' ' -f1
          )
          gcc_size_libstdcxx_scripts_hash=$(
            printf '%s\n' \
              "$(hash_dir build-gcc-size-libstdcxx.sh)" \
              "$(hash_dir build-toolchain-args.sh)" \
              "$(hash_dir build-common.sh)" \
            | sha256sum | cut -d' ' -f1
          )
          gdb_scripts_hash=$(
            printf '%s\n' \
              "$(hash_dir build-gdb.sh)" \
              "$(hash_dir build-toolchain-args.sh)" \
              "$(hash_dir build-common.sh)" \
            | sha256sum | cut -d' ' -f1
          )
          final_scripts_hash=$(
            printf '%s\n' \
              "$(hash_dir build-toolchain.sh)" \
              "$(hash_dir build-toolchain-args.sh)" \
              "$(hash_dir build-common.sh)" \
            | sha256sum | cut -d' ' -f1
          )
          prereqs_key="${{ steps.cache-prerequisites.outputs.cache-primary-key }}"

          binutils_src=$(hash_dir src/binutils)
          gcc_src=$(hash_dir src/gcc)
          newlib_src=$(hash_dir src/newlib)
          gdb_src=$(hash_dir src/gdb)
          specs_src=$(hash_dir src/specs)

          key_binutils=$(printf '%s' "${{ runner.os }}-stage-binutils-${binutils_scripts_hash}-${prereqs_key}-${binutils_src}" | sha256sum | cut -d' ' -f1)
          key_gcc_first=$(printf '%s' "${{ runner.os }}-stage-gcc-first-${gcc_first_scripts_hash}-${key_binutils}-${gcc_src}" | sha256sum | cut -d' ' -f1)
          key_newlib=$(printf '%s' "${{ runner.os }}-stage-newlib-${newlib_scripts_hash}-${key_gcc_first}-${newlib_src}" | sha256sum | cut -d' ' -f1)
          key_newlib_nano=$(printf '%s' "${{ runner.os }}-stage-newlib-nano-${newlib_nano_scripts_hash}-${key_gcc_first}-${newlib_src}" | sha256sum | cut -d' ' -f1)
          key_gcc_final=$(printf '%s' "${{ runner.os }}-stage-gcc-final-${gcc_final_scripts_hash}-${key_newlib}-${gcc_src}" | sha256sum | cut -d' ' -f1)
          key_gcc_size=$(printf '%s' "${{ runner.os }}-stage-gcc-size-libstdcxx-${gcc_size_libstdcxx_scripts_hash}-${key_gcc_final}-${key_newlib_nano}-${gcc_src}" | sha256sum | cut -d' ' -f1)
          key_gdb=$(printf '%s' "${{ runner.os }}-stage-gdb-${gdb_scripts_hash}-${key_binutils}-${gdb_src}" | sha256sum | cut -d' ' -f1)
          key_final=$(printf '%s' "${{ runner.os }}-stage-final-${final_scripts_hash}-${key_gcc_size}-${key_gdb}-${specs_src}" | sha256sum | cut -d' ' -f1)

          {
            echo "binutils=${key_binutils}"
            echo "gcc-first=${key_gcc_first}"
            echo "newlib=${key_newlib}"
            echo "newlib-nano=${key_newlib_nano}"
            echo "gcc-final=${key_gcc_final}"
            echo "gcc-size-libstdcxx=${key_gcc_size}"
            echo "gdb=${key_gdb}"
            echo "final=${key_final}"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Job: build-binutils
  # Setup + prerequisites + binutils (stage III-0).  All subsequent build jobs
  # depend on this job so that the binutils stage cache is available.
  # ---------------------------------------------------------------------------
  build-binutils:
    needs: [check-changes, compute-hashes]
    if: needs.check-changes.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      binutils-build-time: ${{ steps.build-binutils.outputs.build-time-seconds }}
      binutils-cache-hit: ${{ steps.build-binutils.outputs.cache-hit }}
      binutils-cache-sizes: ${{ steps.cache-sizes-binutils.outputs.cache-size-bytes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Compute source tree hashes
        id: src-hashes
        run: |
          set -euo pipefail
          toolchain_src_hash=$(
            printf '%s\n' \
              src/binutils \
              src/gcc \
              src/gdb \
              src/newlib \
              src/libiconv \
              src/liblongpath-win32 \
              src/specs \
            | while read -r dir; do
                git rev-parse "HEAD:${dir}"
              done \
            | sha256sum \
            | cut -d' ' -f1
          )
          echo "toolchain-src=${toolchain_src_hash}" >> "${GITHUB_OUTPUT}"

      - name: Restore cache – prerequisites
        id: cache-prerequisites
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: build-native/host-libs
          key: ${{ runner.os }}-prerequisites-${{ hashFiles('build-prerequisites.sh', 'build-common.sh', 'src/gmp/**', 'src/mpfr/**', 'src/mpc/**', 'src/isl/**', 'src/expat/**', 'src/zlib*/**') }}


      - name: Restore cache – toolchain
        id: cache-toolchain
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: install-native
          # hashFiles('build-*.sh') is intentionally broad: the final toolchain
          # cache represents the assembled output of every stage, so a change to
          # any per-stage script must invalidate it.  Individual stage caches use
          # narrower per-stage keys computed in the Compute stage source hashes step.
          key: ${{ runner.os }}-toolchain-v2-${{ hashFiles('build-*.sh') }}-${{ steps.src-hashes.outputs.toolchain-src }}

      # --- Stage: binutils ---
      - name: Restore cache – binutils
        id: pre-restore
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: install-native
          key: ${{ runner.os }}-stage-v2-${{ needs.compute-hashes.outputs.binutils }}

      - name: Free disk space
        if: steps.cache-toolchain.outputs.cache-hit != 'true' && steps.pre-restore.outputs.cache-hit != 'true'
        run: |
          sudo apt-get remove -y \
            '^dotnet-.*' \
            '^llvm-.*' \
            'php.*' \
            azure-cli \
            google-chrome-stable \
            firefox \
            powershell \
            mono-devel \
            || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install system dependencies
        if: steps.cache-toolchain.outputs.cache-hit != 'true' && steps.pre-restore.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            yacc \
            flex \
            gcc-arm-none-eabi \
            gdb-multiarch \
            cmake \
            git \
            openocd \
            python3 \
            python3-pip \
            python3-venv \
            texi2html \
            texinfo \
            automake
          for version in 1.15 1.14; do
            for tool in aclocal automake; do
              target="/usr/bin/${tool}-1.16"
              link="/usr/bin/${tool}-${version}"
              if [ -e "$link" ] || [ -L "$link" ]; then
                if [ "$(readlink -f "$link" 2>/dev/null || echo "")" != "$target" ]; then
                  echo "ERROR: $link already exists and does not point to $target" >&2
                  exit 1
                fi
              else
                sudo ln -s "$target" "$link"
              fi
            done
          done

      - name: Set up Python virtual environment
        if: steps.cache-toolchain.outputs.cache-hit != 'true' && steps.pre-restore.outputs.cache-hit != 'true'
        run: |
          STM32_VENV_PATH=/opt/stm32-venv
          sudo mkdir -p "${STM32_VENV_PATH}"
          sudo chown "$USER" "${STM32_VENV_PATH}"
          python3 -m venv "${STM32_VENV_PATH}"
          "${STM32_VENV_PATH}/bin/python3" -m pip install python-magic==0.4.27
          echo "${STM32_VENV_PATH}/bin" >> "${GITHUB_PATH}"
          echo "STM32_VENV_PATH=${STM32_VENV_PATH}" >> "${GITHUB_ENV}"

      - name: Build prerequisites
        if: steps.cache-prerequisites.outputs.cache-hit != 'true' && steps.cache-toolchain.outputs.cache-hit != 'true' && steps.pre-restore.outputs.cache-hit != 'true'
        run: |
          JOBS=$(nproc)
          export JOBS
          ./build-prerequisites.sh --skip_steps=mingw,howto,package_sources

      - name: Save cache – prerequisites
        if: steps.cache-prerequisites.outputs.cache-hit != 'true' && steps.cache-toolchain.outputs.cache-hit != 'true' && steps.pre-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: build-native/host-libs
          key: ${{ steps.cache-prerequisites.outputs.cache-primary-key }}

      - name: Build and cache stage – binutils
        id: build-binutils
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        uses: ./.github/actions/build-stage
        with:
          stage-name: binutils
          cache-paths: install-native
          cache-key: ${{ runner.os }}-stage-v2-${{ needs.compute-hashes.outputs.binutils }}
          build-script: ./build-binutils.sh
          pre-cache-hit: ${{ steps.pre-restore.outputs.cache-hit == 'true' }}
          save-in-merge-group: 'true'

      - name: Report cache sizes – binutils
        id: cache-sizes-binutils
        if: always()
        run: |
          set -euo pipefail
          if [ -d install-native ]; then
            size_human=$(du -sh install-native | cut -f1)
            size_bytes=$(du -sb install-native | cut -f1)
          else
            size_human="(not found)"
            size_bytes="0"
          fi
          {
            echo "| Stage | Path | Size |"
            echo "|-------|------|------|"
            echo "| binutils | install-native | ${size_human} |"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "cache-size-bytes=${size_bytes}" >> "${GITHUB_OUTPUT}"

  # ---------------------------------------------------------------------------
  # Job: build-gdb
  # GDB build (stage III-6).  Runs in PARALLEL with the gcc/newlib chain since
  # GDB only depends on binutils.  This takes the GDB build (1–2+ hours) off
  # the critical path.
  # ---------------------------------------------------------------------------
  build-gdb:
    needs: [check-changes, compute-hashes, build-binutils]
    if: needs.check-changes.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      gdb-build-time: ${{ steps.build-gdb.outputs.build-time-seconds }}
      gdb-cache-hit: ${{ steps.build-gdb.outputs.cache-hit }}
      gdb-cache-sizes: ${{ steps.cache-sizes-gdb.outputs.cache-size-bytes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Compute source tree hashes
        id: src-hashes
        run: |
          set -euo pipefail
          toolchain_src_hash=$(
            printf '%s\n' \
              src/binutils \
              src/gcc \
              src/gdb \
              src/newlib \
              src/libiconv \
              src/liblongpath-win32 \
              src/specs \
            | while read -r dir; do
                git rev-parse "HEAD:${dir}"
              done \
            | sha256sum \
            | cut -d' ' -f1
          )
          echo "toolchain-src=${toolchain_src_hash}" >> "${GITHUB_OUTPUT}"

      - name: Restore cache – prerequisites
        id: cache-prerequisites
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: build-native/host-libs
          key: ${{ runner.os }}-prerequisites-${{ hashFiles('build-prerequisites.sh', 'build-common.sh', 'src/gmp/**', 'src/mpfr/**', 'src/mpc/**', 'src/isl/**', 'src/expat/**', 'src/zlib*/**') }}

      - name: Restore cache – toolchain
        id: cache-toolchain
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: install-native
          key: ${{ runner.os }}-toolchain-${{ hashFiles('build-*.sh') }}-${{ steps.src-hashes.outputs.toolchain-src }}

      # --- Stage: gdb ---
      - name: Restore cache – gdb
        id: pre-restore
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: install-native
          key: ${{ runner.os }}-stage-v2-${{ needs.compute-hashes.outputs.gdb }}

      - name: Restore cache – binutils (baseline for gdb build)
        if: steps.cache-toolchain.outputs.cache-hit != 'true' && steps.pre-restore.outputs.cache-hit != 'true'
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: install-native
          key: ${{ runner.os }}-stage-v2-${{ needs.compute-hashes.outputs.binutils }}

      - name: Free disk space
        if: steps.cache-toolchain.outputs.cache-hit != 'true' && steps.pre-restore.outputs.cache-hit != 'true'
        run: |
          sudo apt-get remove -y \
            '^dotnet-.*' \
            '^llvm-.*' \
            'php.*' \
            azure-cli \
            google-chrome-stable \
            firefox \
            powershell \
            mono-devel \
            || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install system dependencies
        if: steps.cache-toolchain.outputs.cache-hit != 'true' && steps.pre-restore.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            yacc \
            flex \
            gcc-arm-none-eabi \
            gdb-multiarch \
            cmake \
            git \
            openocd \
            python3 \
            python3-pip \
            python3-venv \
            texi2html \
            texinfo \
            automake
          for version in 1.15 1.14; do
            for tool in aclocal automake; do
              target="/usr/bin/${tool}-1.16"
              link="/usr/bin/${tool}-${version}"
              if [ -e "$link" ] || [ -L "$link" ]; then
                if [ "$(readlink -f "$link" 2>/dev/null || echo "")" != "$target" ]; then
                  echo "ERROR: $link already exists and does not point to $target" >&2
                  exit 1
                fi
              else
                sudo ln -s "$target" "$link"
              fi
            done
          done

      - name: Set up Python virtual environment
        if: steps.cache-toolchain.outputs.cache-hit != 'true' && steps.pre-restore.outputs.cache-hit != 'true'
        run: |
          STM32_VENV_PATH=/opt/stm32-venv
          sudo mkdir -p "${STM32_VENV_PATH}"
          sudo chown "$USER" "${STM32_VENV_PATH}"
          python3 -m venv "${STM32_VENV_PATH}"
          "${STM32_VENV_PATH}/bin/python3" -m pip install python-magic==0.4.27
          echo "${STM32_VENV_PATH}/bin" >> "${GITHUB_PATH}"
          echo "STM32_VENV_PATH=${STM32_VENV_PATH}" >> "${GITHUB_ENV}"

      - name: Build prerequisites on cache miss
        if: steps.cache-prerequisites.outputs.cache-hit != 'true' && steps.cache-toolchain.outputs.cache-hit != 'true' && steps.pre-restore.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          JOBS="${JOBS:-$(nproc)}"
          export JOBS
          ./build-prerequisites.sh --skip_steps=mingw,howto,package_sources

      - name: Build and cache stage – gdb
        id: build-gdb
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        uses: ./.github/actions/build-stage
        with:
          stage-name: gdb
          cache-paths: install-native
          cache-key: ${{ runner.os }}-stage-v2-${{ needs.compute-hashes.outputs.gdb }}
          build-script: ./build-gdb.sh
          pre-cache-hit: ${{ steps.pre-restore.outputs.cache-hit == 'true' }}
          save-in-merge-group: 'true'

      - name: Report cache sizes – gdb
        id: cache-sizes-gdb
        if: always()
        run: |
          set -euo pipefail
          if [ -d install-native ]; then
            size_human=$(du -sh install-native | cut -f1)
            size_bytes=$(du -sb install-native | cut -f1)
          else
            size_human="(not found)"
            size_bytes="0"
          fi
          {
            echo "| Stage | Path | Size |"
            echo "|-------|------|------|"
            echo "| gdb | install-native | ${size_human} |"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "cache-size-bytes=${size_bytes}" >> "${GITHUB_OUTPUT}"

  # ---------------------------------------------------------------------------
  # Job: build-gcc-first
  # GCC first stage (III-1).  Runs immediately after build-binutils and
  # produces the minimal C-only compiler needed by the newlib builds.
  # ---------------------------------------------------------------------------
  build-gcc-first:
    needs: [check-changes, compute-hashes, build-binutils]
    if: needs.check-changes.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      gcc-first-build-time: ${{ steps.build-gcc-first.outputs.build-time-seconds }}
      gcc-first-cache-hit: ${{ steps.build-gcc-first.outputs.cache-hit }}
      gcc-first-cache-sizes: ${{ steps.cache-sizes-gcc-first.outputs.cache-size-bytes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # --- Stage: gcc-first ---
      - name: Restore cache – gcc-first
        id: pre-restore
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: install-native
          key: ${{ runner.os }}-stage-v2-${{ needs.compute-hashes.outputs['gcc-first'] }}

      - name: Free disk space
        if: steps.pre-restore.outputs.cache-hit != 'true'
        run: |
          sudo apt-get remove -y \
            '^dotnet-.*' \
            '^llvm-.*' \
            'php.*' \
            azure-cli \
            google-chrome-stable \
            firefox \
            powershell \
            mono-devel \
            || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install system dependencies
        if: steps.pre-restore.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            yacc \
            flex \
            gcc-arm-none-eabi \
            gdb-multiarch \
            cmake \
            git \
            openocd \
            python3 \
            python3-pip \
            python3-venv \
            texi2html \
            texinfo \
            automake
          for version in 1.15 1.14; do
            for tool in aclocal automake; do
              target="/usr/bin/${tool}-1.16"
              link="/usr/bin/${tool}-${version}"
              if [ -e "$link" ] || [ -L "$link" ]; then
                if [ "$(readlink -f "$link" 2>/dev/null || echo "")" != "$target" ]; then
                  echo "ERROR: $link already exists and does not point to $target" >&2
                  exit 1
                fi
              else
                sudo ln -s "$target" "$link"
              fi
            done
          done

      - name: Set up Python virtual environment
        if: steps.pre-restore.outputs.cache-hit != 'true'
        run: |
          STM32_VENV_PATH=/opt/stm32-venv
          sudo mkdir -p "${STM32_VENV_PATH}"
          sudo chown "$USER" "${STM32_VENV_PATH}"
          python3 -m venv "${STM32_VENV_PATH}"
          "${STM32_VENV_PATH}/bin/python3" -m pip install python-magic==0.4.27
          echo "${STM32_VENV_PATH}/bin" >> "${GITHUB_PATH}"
          echo "STM32_VENV_PATH=${STM32_VENV_PATH}" >> "${GITHUB_ENV}"

      - name: Restore cache – prerequisites
        id: cache-prerequisites
        if: steps.pre-restore.outputs.cache-hit != 'true'
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: build-native/host-libs
          key: ${{ runner.os }}-prerequisites-${{ hashFiles('build-prerequisites.sh', 'build-common.sh', 'src/gmp/**', 'src/mpfr/**', 'src/mpc/**', 'src/isl/**', 'src/expat/**', 'src/zlib*/**') }}

      - name: Build prerequisites (cache miss)
        if: steps.cache-prerequisites.outputs.cache-hit != 'true' && steps.pre-restore.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          JOBS="${JOBS:-$(nproc)}"
          export JOBS
          ./build-prerequisites.sh --skip_steps=mingw,howto,package_sources

      # Restore binutils as baseline for the gcc-first build
      - name: Restore cache – binutils (baseline)
        if: steps.pre-restore.outputs.cache-hit != 'true'
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: install-native
          key: ${{ runner.os }}-stage-v2-${{ needs.compute-hashes.outputs.binutils }}

      - name: Build and cache stage – gcc-first
        id: build-gcc-first
        uses: ./.github/actions/build-stage
        with:
          stage-name: gcc-first
          cache-paths: install-native
          cache-key: ${{ runner.os }}-stage-v2-${{ needs.compute-hashes.outputs['gcc-first'] }}
          build-script: ./build-gcc-first.sh
          pre-cache-hit: ${{ steps.pre-restore.outputs.cache-hit == 'true' }}
          save-in-merge-group: 'true'

      - name: Report cache sizes – gcc-first
        id: cache-sizes-gcc-first
        if: always()
        run: |
          set -euo pipefail
          if [ -d install-native ]; then
            size_human=$(du -sh install-native | cut -f1)
            size_bytes=$(du -sb install-native | cut -f1)
          else
            size_human="(not found)"
            size_bytes="0"
          fi
          {
            echo "| Stage | Path | Size |"
            echo "|-------|------|------|"
            echo "| gcc-first | install-native | ${size_human} |"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "cache-size-bytes=${size_bytes}" >> "${GITHUB_OUTPUT}"

  # ---------------------------------------------------------------------------
  # Job: build-newlib
  # Newlib standard library (III-2).  Depends on build-gcc-first.
  # ---------------------------------------------------------------------------
  build-newlib:
    needs: [check-changes, compute-hashes, build-gcc-first]
    if: needs.check-changes.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      newlib-build-time: ${{ steps.build-newlib.outputs.build-time-seconds }}
      newlib-cache-hit: ${{ steps.pre-restore.outputs.cache-hit }}
      newlib-cache-sizes: ${{ steps.cache-sizes-newlib.outputs.cache-size-bytes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Compute source tree hashes
        id: src-hashes
        run: |
          set -euo pipefail
          toolchain_src_hash=$(
            printf '%s\n' \
              src/binutils \
              src/gcc \
              src/gdb \
              src/newlib \
              src/libiconv \
              src/liblongpath-win32 \
              src/specs \
            | while read -r dir; do
                git rev-parse "HEAD:${dir}"
              done \
            | sha256sum \
            | cut -d' ' -f1
          )
          echo "toolchain-src=${toolchain_src_hash}" >> "${GITHUB_OUTPUT}"

      - name: Restore cache – toolchain
        id: cache-toolchain
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: install-native
          key: ${{ runner.os }}-toolchain-${{ hashFiles('build-*.sh') }}-${{ steps.src-hashes.outputs.toolchain-src }}
          lookup-only: true

      - name: Restore cache – prerequisites
        id: cache-prerequisites
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: build-native/host-libs
          key: ${{ runner.os }}-prerequisites-${{ hashFiles('build-prerequisites.sh', 'build-common.sh', 'src/gmp/**', 'src/mpfr/**', 'src/mpc/**', 'src/isl/**', 'src/expat/**', 'src/zlib*/**') }}

      # --- Stage: newlib ---
      - name: Restore cache – newlib
        id: pre-restore
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: install-native
          key: ${{ runner.os }}-stage-v2-${{ needs.compute-hashes.outputs.newlib }}

      - name: Restore cache – gcc-first (baseline for newlib build)
        if: steps.cache-toolchain.outputs.cache-hit != 'true' && steps.pre-restore.outputs.cache-hit != 'true'
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: install-native
          key: ${{ runner.os }}-stage-v2-${{ needs.compute-hashes.outputs['gcc-first'] }}

      - name: Free disk space
        if: steps.cache-toolchain.outputs.cache-hit != 'true' && steps.pre-restore.outputs.cache-hit != 'true'
        run: |
          sudo apt-get remove -y \
            '^dotnet-.*' \
            '^llvm-.*' \
            'php.*' \
            azure-cli \
            google-chrome-stable \
            firefox \
            powershell \
            mono-devel \
            || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install system dependencies
        if: steps.cache-toolchain.outputs.cache-hit != 'true' && steps.pre-restore.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            yacc \
            flex \
            gcc-arm-none-eabi \
            gdb-multiarch \
            cmake \
            git \
            openocd \
            python3 \
            python3-pip \
            python3-venv \
            texi2html \
            texinfo \
            automake
          for version in 1.15 1.14; do
            for tool in aclocal automake; do
              target="/usr/bin/${tool}-1.16"
              link="/usr/bin/${tool}-${version}"
              if [ -e "$link" ] || [ -L "$link" ]; then
                if [ "$(readlink -f "$link" 2>/dev/null || echo "")" != "$target" ]; then
                  echo "ERROR: $link already exists and does not point to $target" >&2
                  exit 1
                fi
              else
                sudo ln -s "$target" "$link"
              fi
            done
          done

      - name: Set up Python virtual environment
        if: steps.cache-toolchain.outputs.cache-hit != 'true' && steps.pre-restore.outputs.cache-hit != 'true'
        run: |
          STM32_VENV_PATH=/opt/stm32-venv
          sudo mkdir -p "${STM32_VENV_PATH}"
          sudo chown "$USER" "${STM32_VENV_PATH}"
          python3 -m venv "${STM32_VENV_PATH}"
          "${STM32_VENV_PATH}/bin/python3" -m pip install python-magic==0.4.27
          echo "${STM32_VENV_PATH}/bin" >> "${GITHUB_PATH}"
          echo "STM32_VENV_PATH=${STM32_VENV_PATH}" >> "${GITHUB_ENV}"

      - name: Build prerequisites on cache miss
        if: steps.cache-prerequisites.outputs.cache-hit != 'true' && steps.cache-toolchain.outputs.cache-hit != 'true' && steps.pre-restore.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          JOBS="${JOBS:-$(nproc)}"
          export JOBS
          ./build-prerequisites.sh --skip_steps=mingw,howto,package_sources

      - name: Save cache – prerequisites
        if: steps.cache-prerequisites.outputs.cache-hit != 'true' && steps.cache-toolchain.outputs.cache-hit != 'true' && steps.pre-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: build-native/host-libs
          key: ${{ steps.cache-prerequisites.outputs.cache-primary-key }}

      - name: Build and cache stage – newlib
        id: build-newlib
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        uses: ./.github/actions/build-stage
        with:
          stage-name: newlib
          cache-paths: install-native
          cache-key: ${{ runner.os }}-stage-v2-${{ needs.compute-hashes.outputs.newlib }}
          build-script: ./build-newlib.sh
          pre-cache-hit: ${{ steps.pre-restore.outputs.cache-hit == 'true' }}
          save-in-merge-group: 'true'

      - name: Report cache sizes – newlib
        id: cache-sizes-newlib
        if: always()
        run: |
          set -euo pipefail
          if [ -d install-native ]; then
            size_human=$(du -sh install-native | cut -f1)
            size_bytes=$(du -sb install-native | cut -f1)
          else
            size_human="(not found)"
            size_bytes="0"
          fi
          {
            echo "| Stage | Path | Size |"
            echo "|-------|------|------|"
            echo "| newlib | install-native | ${size_human} |"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "cache-size-bytes=${size_bytes}" >> "${GITHUB_OUTPUT}"

  # ---------------------------------------------------------------------------
  # Job: build-newlib-nano
  # Newlib-nano size-optimised library (III-3).  Depends on build-gcc-first and
  # runs in PARALLEL with build-newlib.  Outputs to build-native/target-libs/
  # only; install-native/ is NOT modified by this stage.
