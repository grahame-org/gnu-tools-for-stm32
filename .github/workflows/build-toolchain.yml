name: Build STM32 Toolchain

on:
  push:
    branches:
      - 13.3.rel1
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

jobs:
  check-changes:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should-build: ${{ steps.filter.outputs.build || 'true' }}
    steps:
      - name: Check for build-relevant file changes
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            build:
              - 'src/**'
              - 'build-binutils.sh'
              - 'build-common.sh'
              - 'build-gcc-first.sh'
              - 'build-gcc-final.sh'
              - 'build-gcc-size-libstdcxx.sh'
              - 'build-gdb.sh'
              - 'build-newlib.sh'
              - 'build-newlib-nano.sh'
              - 'build-prerequisites.sh'
              - 'build-toolchain.sh'
              - '.github/workflows/build-toolchain.yml'
              - 'test_project/**'

  build:
    needs: check-changes
    if: needs.check-changes.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo apt-get remove -y \
            '^dotnet-.*' \
            '^llvm-.*' \
            'php.*' \
            azure-cli \
            google-chrome-stable \
            firefox \
            powershell \
            mono-devel \
            || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            yacc \
            flex \
            gcc-arm-none-eabi \
            gdb-multiarch \
            cmake \
            git \
            openocd \
            python3 \
            python3-pip \
            python3-venv \
            texi2html \
            texinfo \
            automake
          for version in 1.15 1.14; do
            for tool in aclocal automake; do
              target="/usr/bin/${tool}-1.16"
              link="/usr/bin/${tool}-${version}"
              if [ -e "$link" ] || [ -L "$link" ]; then
                if [ "$(readlink -f "$link" 2>/dev/null || echo "")" != "$target" ]; then
                  echo "ERROR: $link already exists and does not point to $target" >&2
                  exit 1
                fi
              else
                sudo ln -s "$target" "$link"
              fi
            done
          done

      - name: Set up Python virtual environment
        run: |
          STM32_VENV_PATH=/opt/stm32-venv
          sudo mkdir -p "${STM32_VENV_PATH}"
          sudo chown "$USER" "${STM32_VENV_PATH}"
          python3 -m venv "${STM32_VENV_PATH}"
          "${STM32_VENV_PATH}/bin/python3" -m pip install python-magic==0.4.27
          echo "${STM32_VENV_PATH}/bin" >> "${GITHUB_PATH}"
          echo "STM32_VENV_PATH=${STM32_VENV_PATH}" >> "${GITHUB_ENV}"

      - name: Compute source tree hashes
        id: src-hashes
        run: |
          set -euo pipefail
          # Use git tree-object SHAs to derive a stable hash of each source
          # directory.  git rev-parse HEAD:<path> resolves to the tree SHA for
          # that directory and changes only when files inside it change.
          # This avoids hashFiles() scanning the ~217 k-file src/ tree, which
          # would exceed the 120-second hashFiles timeout.
          toolchain_src_hash=$(
            printf '%s\n' \
              src/binutils \
              src/gcc \
              src/gdb \
              src/newlib \
              src/libiconv \
              src/liblongpath-win32 \
              src/specs \
            | while read -r dir; do
                git rev-parse "HEAD:${dir}"
              done \
            | sha256sum \
            | cut -d' ' -f1
          )
          echo "toolchain-src=${toolchain_src_hash}" >> "${GITHUB_OUTPUT}"

      - name: Restore cache – prerequisites
        id: cache-prerequisites
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: build-native/host-libs
          key: ${{ runner.os }}-prerequisites-${{ hashFiles('build-prerequisites.sh', 'build-common.sh', 'src/gmp/**', 'src/mpfr/**', 'src/mpc/**', 'src/isl/**', 'src/expat/**', 'src/zlib*/**') }}

      - name: Build prerequisites
        if: steps.cache-prerequisites.outputs.cache-hit != 'true'
        run: |
          JOBS=$(nproc)
          export JOBS
          ./build-prerequisites.sh --skip_steps=mingw,howto,package_sources

      - name: Save cache – prerequisites
        if: steps.cache-prerequisites.outputs.cache-hit != 'true' && github.event_name != 'merge_group'
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: build-native/host-libs
          key: ${{ steps.cache-prerequisites.outputs.cache-primary-key }}

      - name: Compute stage source hashes
        id: stage-hashes
        run: |
          hash_dir() { git rev-parse HEAD:"$1" 2>/dev/null || echo "missing-$1"; }
          scripts_hash=$(echo "$(hash_dir build-toolchain.sh)$(hash_dir build-binutils.sh)$(hash_dir build-toolchain-args.sh)$(hash_dir build-common.sh)" | sha256sum | cut -d' ' -f1)
          binutils_scripts_hash=$(echo "$(hash_dir build-binutils.sh)$(hash_dir build-toolchain-args.sh)$(hash_dir build-common.sh)" | sha256sum | cut -d' ' -f1)
          gcc_first_scripts_hash=$(echo "$(hash_dir build-gcc-first.sh)$(hash_dir build-toolchain-args.sh)$(hash_dir build-common.sh)" | sha256sum | cut -d' ' -f1)
          newlib_scripts_hash=$(echo "$(hash_dir build-newlib.sh)$(hash_dir build-toolchain-args.sh)$(hash_dir build-common.sh)" | sha256sum | cut -d' ' -f1)
          newlib_nano_scripts_hash=$(echo "$(hash_dir build-newlib-nano.sh)$(hash_dir build-toolchain-args.sh)$(hash_dir build-common.sh)" | sha256sum | cut -d' ' -f1)
          gcc_final_scripts_hash=$(echo "$(hash_dir build-gcc-final.sh)$(hash_dir build-toolchain-args.sh)$(hash_dir build-common.sh)" | sha256sum | cut -d' ' -f1)
          gcc_size_libstdcxx_scripts_hash=$(echo "$(hash_dir build-gcc-size-libstdcxx.sh)$(hash_dir build-toolchain-args.sh)$(hash_dir build-common.sh)" | sha256sum | cut -d' ' -f1)
          gdb_scripts_hash=$(echo "$(hash_dir build-gdb.sh)$(hash_dir build-toolchain-args.sh)$(hash_dir build-common.sh)" | sha256sum | cut -d' ' -f1)
          prereqs_key="${{ steps.cache-prerequisites.outputs.cache-primary-key }}"

          binutils_src=$(hash_dir src/binutils)
          gcc_src=$(hash_dir src/gcc)
          newlib_src=$(hash_dir src/newlib)
          gdb_src=$(hash_dir src/gdb)
          specs_src=$(hash_dir src/specs)

          key_binutils=$(printf '%s' "${{ runner.os }}-stage-binutils-${binutils_scripts_hash}-${prereqs_key}-${binutils_src}" | sha256sum | cut -d' ' -f1)
          key_gcc_first=$(printf '%s' "${{ runner.os }}-stage-gcc-first-${gcc_first_scripts_hash}-${key_binutils}-${gcc_src}" | sha256sum | cut -d' ' -f1)
          key_newlib=$(printf '%s' "${{ runner.os }}-stage-newlib-${newlib_scripts_hash}-${key_gcc_first}-${newlib_src}" | sha256sum | cut -d' ' -f1)
          key_newlib_nano=$(printf '%s' "${{ runner.os }}-stage-newlib-nano-${newlib_nano_scripts_hash}-${key_newlib}-${newlib_src}" | sha256sum | cut -d' ' -f1)
          key_gcc_final=$(printf '%s' "${{ runner.os }}-stage-gcc-final-${gcc_final_scripts_hash}-${key_newlib_nano}-${gcc_src}" | sha256sum | cut -d' ' -f1)
          key_gcc_size=$(printf '%s' "${{ runner.os }}-stage-gcc-size-libstdcxx-${gcc_size_libstdcxx_scripts_hash}-${key_gcc_final}-${gcc_src}" | sha256sum | cut -d' ' -f1)
          key_gdb=$(printf '%s' "${{ runner.os }}-stage-gdb-${gdb_scripts_hash}-${key_binutils}-${gdb_src}" | sha256sum | cut -d' ' -f1)
          key_final=$(printf '%s' "${{ runner.os }}-stage-final-${scripts_hash}-${key_gdb}-${specs_src}" | sha256sum | cut -d' ' -f1)

          {
            echo "binutils=${key_binutils}"
            echo "gcc-first=${key_gcc_first}"
            echo "newlib=${key_newlib}"
            echo "newlib-nano=${key_newlib_nano}"
            echo "gcc-final=${key_gcc_final}"
            echo "gcc-size-libstdcxx=${key_gcc_size}"
            echo "gdb=${key_gdb}"
            echo "final=${key_final}"
          } >> "$GITHUB_OUTPUT"

      - name: Restore cache – toolchain
        id: cache-toolchain
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: install-native
          key: ${{ runner.os }}-toolchain-${{ hashFiles('build-toolchain.sh', 'build-prerequisites.sh', 'build-common.sh') }}-${{ steps.src-hashes.outputs.toolchain-src }}

      # --- Stage: binutils ---
      - name: Restore cache – binutils
        id: cache-binutils
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: install-native
          key: ${{ runner.os }}-stage-v1-${{ steps.stage-hashes.outputs.binutils }}

      - name: Build stage – binutils
        if: steps.cache-toolchain.outputs.cache-hit != 'true' && steps.cache-binutils.outputs.cache-hit != 'true'
        run: |
          JOBS=$(nproc)
          export JOBS
          ./build-binutils.sh \
            --skip_steps=mingw,mingw-gdb-with-python,gdb-with-python,manual,package_sources

      - name: Save cache – binutils
        if: steps.cache-toolchain.outputs.cache-hit != 'true' && steps.cache-binutils.outputs.cache-hit != 'true' && github.event_name != 'merge_group'
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: install-native
          key: ${{ runner.os }}-stage-v1-${{ steps.stage-hashes.outputs.binutils }}

      # --- Stage: gcc-first ---
      - name: Restore cache – gcc-first
        id: cache-gcc-first
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: install-native
          key: ${{ runner.os }}-stage-v1-${{ steps.stage-hashes.outputs['gcc-first'] }}

      - name: Build stage – gcc-first
        if: steps.cache-toolchain.outputs.cache-hit != 'true' && steps.cache-gcc-first.outputs.cache-hit != 'true'
        run: |
          JOBS=$(nproc)
          export JOBS
          ./build-gcc-first.sh \
            --skip_steps=mingw,mingw-gdb-with-python,gdb-with-python,manual,package_sources

      - name: Save cache – gcc-first
        if: steps.cache-toolchain.outputs.cache-hit != 'true' && steps.cache-gcc-first.outputs.cache-hit != 'true' && github.event_name != 'merge_group'
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: install-native
          key: ${{ runner.os }}-stage-v1-${{ steps.stage-hashes.outputs['gcc-first'] }}

      # --- Stage: newlib ---
      - name: Restore cache – newlib
        id: cache-newlib
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: install-native
          key: ${{ runner.os }}-stage-v1-${{ steps.stage-hashes.outputs.newlib }}

      - name: Build stage – newlib
        if: steps.cache-toolchain.outputs.cache-hit != 'true' && steps.cache-newlib.outputs.cache-hit != 'true'
        run: |
          JOBS=$(nproc)
          export JOBS
          ./build-newlib.sh \
            --skip_steps=mingw,mingw-gdb-with-python,gdb-with-python,manual,package_sources

      - name: Save cache – newlib
        if: steps.cache-toolchain.outputs.cache-hit != 'true' && steps.cache-newlib.outputs.cache-hit != 'true' && github.event_name != 'merge_group'
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: install-native
          key: ${{ runner.os }}-stage-v1-${{ steps.stage-hashes.outputs.newlib }}

      # --- Stage: newlib-nano ---
      - name: Restore cache – newlib-nano
        id: cache-newlib-nano
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        with:
          path: |
            install-native
            build-native/target-libs
          key: ${{ runner.os }}-stage-v1-${{ steps.stage-hashes.outputs['newlib-nano'] }}

      - name: Build stage – newlib-nano
        if: steps.cache-toolchain.outputs.cache-hit != 'true' && steps.cache-newlib-nano.outputs.cache-hit != 'true'
        run: |
          JOBS=$(nproc)
          export JOBS
          ./build-newlib-nano.sh \
            --skip_steps=mingw,mingw-gdb-with-python,gdb-with-python,manual,package_sources

      - name: Save cache – newlib-nano
        if: steps.cache-toolchain.outputs.cache-hit != 'true' && steps.cache-newlib-nano.outputs.cache-hit != 'true' && github.event_name != 'merge_group'
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            install-native
            build-native/target-libs
          key: ${{ runner.os }}-stage-v1-${{ steps.stage-hashes.outputs['newlib-nano'] }}

      # --- Stage: gcc-final ---
      - name: Restore cache – gcc-final
        id: cache-gcc-final
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        if: steps.cache-newlib-nano.outputs.cache-hit != 'true'
        with:
          path: install-native
          key: ${{ runner.os }}-stage-v1-${{ steps.stage-hashes.outputs['gcc-final'] }}

      - name: Build stage – gcc-final
        if: steps.cache-gcc-final.outputs.cache-hit != 'true' && steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          JOBS=$(nproc)
          export JOBS
          ./build-toolchain.sh \
            --skip_steps=mingw,mingw-gdb-with-python,gdb-with-python,manual,package_sources \
            --skip_stages=binutils,gcc-first,newlib,newlib-nano,gcc-size-libstdcxx,gdb

      - name: Save cache – gcc-final
        if: steps.cache-gcc-final.outputs.cache-hit != 'true' && steps.cache-toolchain.outputs.cache-hit != 'true' && github.event_name != 'merge_group'
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: install-native
          key: ${{ runner.os }}-stage-v1-${{ steps.stage-hashes.outputs['gcc-final'] }}

      # --- Stage: gcc-size-libstdcxx ---
      - name: Restore cache – gcc-size-libstdcxx
        id: cache-gcc-size-libstdcxx
        if: steps.cache-gcc-final.outputs.cache-hit != 'true'
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: install-native
          key: ${{ runner.os }}-stage-v1-${{ steps.stage-hashes.outputs['gcc-size-libstdcxx'] }}

      - name: Build stage – gcc-size-libstdcxx
        if: steps.cache-gcc-size-libstdcxx.outputs.cache-hit != 'true' && steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          JOBS=$(nproc)
          export JOBS
          ./build-gcc-size-libstdcxx.sh \
            --skip_steps=mingw,mingw-gdb-with-python,gdb-with-python,manual,package_sources

      - name: Save cache – gcc-size-libstdcxx
        if: steps.cache-gcc-size-libstdcxx.outputs.cache-hit != 'true' && steps.cache-toolchain.outputs.cache-hit != 'true' && github.event_name != 'merge_group'
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: install-native
          key: ${{ runner.os }}-stage-v1-${{ steps.stage-hashes.outputs['gcc-size-libstdcxx'] }}

      - name: Build toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          JOBS=$(nproc)
          export JOBS
          ./build-toolchain.sh \
            --skip_steps=mingw,mingw-gdb-with-python,gdb-with-python,manual,package_sources \
            --skip_stages=binutils,gcc-first,newlib,newlib-nano,gcc-final,gcc-size-libstdcxx

      - name: Save cache – toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true' && github.event_name != 'merge_group'
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: install-native
          key: ${{ steps.cache-toolchain.outputs.cache-primary-key }}

      - name: Build test_project with toolchain
        run: |
          export PATH="${GITHUB_WORKSPACE}/install-native/bin:${PATH}"
          # Verify the toolchain under test is found before invoking cmake
          actual=$(command -v arm-none-eabi-gcc)
          if [[ "${actual}" != "${GITHUB_WORKSPACE}/install-native/bin/arm-none-eabi-gcc" ]]; then
            echo "ERROR: arm-none-eabi-gcc not resolved to install-native/bin (got: ${actual})" >&2
            exit 1
          fi
          arm-none-eabi-gcc --version
          rm -rf test_project/build && mkdir -p test_project/build
          cmake -G "Unix Makefiles" \
            -DCMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/test_project/arm-none-eabi-gcc.cmake" \
            -DCMAKE_C_COMPILER="${GITHUB_WORKSPACE}/install-native/bin/arm-none-eabi-gcc" \
            -DCMAKE_CXX_COMPILER="${GITHUB_WORKSPACE}/install-native/bin/arm-none-eabi-g++" \
            -B test_project/build \
            -S test_project
          cmake --build test_project/build --verbose -- -j "$(nproc)"

      - name: Compare test_project artifacts against reference binaries
        run: |
          set -euo pipefail
          if [ ! -d "test_project/reference" ]; then
            echo "ERROR: test_project/reference directory does not exist."
            exit 1
          fi
          PASS=true
          compared=0
          for ref_file in test_project/reference/*; do
            [ -f "${ref_file}" ] || continue
            # Skip documentation files
            case "${ref_file}" in *.md) continue ;; esac
            # Skip files known to differ between the Windows/CubeIDE reference
            # build and a Linux CI build:
            #   .elf — DWARF debug-info sections embed absolute source/toolchain paths.
            #   .map — linker map contains absolute paths to toolchain library archives.
            #   .hex — Intel HEX encoding can vary between objcopy versions/platforms.
            # Only .bin (raw binary dump of load segments) is a meaningful
            # byte-for-byte check across platforms.
            case "${ref_file}" in *.elf | *.map | *.hex) continue ;; esac
            artifact_name=$(basename "${ref_file}")
            built_file="test_project/build/${artifact_name}"
            if [ ! -f "${built_file}" ]; then
              echo "FAIL: ${artifact_name} not found in build output"
              PASS=false
            elif cmp --silent "${ref_file}" "${built_file}"; then
              echo "PASS: ${artifact_name} matches reference"
            else
              echo "FAIL: ${artifact_name} differs from reference"
              echo "  reference size : $(wc -c < "${ref_file}") bytes"
              echo "  built size     : $(wc -c < "${built_file}") bytes"
              PASS=false
            fi
            compared=$((compared + 1))
          done
          if [ "${compared}" -eq 0 ]; then
            echo "ERROR: No reference artifacts found to compare."
            exit 1
          fi
          if [ "${PASS}" != "true" ]; then
            echo "One or more artifacts differ from the reference binaries."
            exit 1
          fi
          echo "All artifacts match reference binaries."

  build-status:
    runs-on: ubuntu-slim
    needs: [check-changes, build]
    if: always()
    steps:
      - name: Report build status
        run: |
          if [[ "${{ needs.check-changes.result }}" == "failure" || "${{ needs.check-changes.result }}" == "cancelled" ]]; then
            echo "check-changes job failed or was cancelled" && exit 1
          fi
          if [[ "${{ needs.build.result }}" == "failure" || "${{ needs.build.result }}" == "cancelled" ]]; then
            echo "Build failed or was cancelled" && exit 1
          fi
          echo "Build skipped or succeeded"
