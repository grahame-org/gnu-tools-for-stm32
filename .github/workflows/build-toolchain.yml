      - name: Restore cache – gcc-size-libstdcxx
        id: pre-restore
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            install-native
            build-native/target-libs
          key: ${{ runner.os }}-stage-v2-${{ needs.compute-hashes.outputs['gcc-size-libstdcxx'] }}

      - name: Free disk space
        if: steps.pre-restore.outputs.cache-hit != 'true'
        run: |
          sudo apt-get remove -y \
            '^dotnet-.*' \
            '^llvm-.*' \
            'php.*' \
            azure-cli \
            google-chrome-stable \
            firefox \
            powershell \
            mono-devel \
            || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install system dependencies
        if: steps.pre-restore.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            yacc \
            flex \
            gcc-arm-none-eabi \
            gdb-multiarch \
            cmake \
            git \
            openocd \
            python3 \
            python3-pip \
            python3-venv \
            texi2html \
            texinfo \
            automake \
            ccache
          for version in 1.15 1.14; do
            for tool in aclocal automake; do
              target="/usr/bin/${tool}-1.16"
              link="/usr/bin/${tool}-${version}"
              if [ -e "$link" ] || [ -L "$link" ]; then
                if [ "$(readlink -f "$link" 2>/dev/null || echo "")" != "$target" ]; then
                  echo "ERROR: $link already exists and does not point to $target" >&2
                  exit 1
                fi
              else
                sudo ln -s "$target" "$link"
              fi
            done
          done

      - name: Set up Python virtual environment
        if: steps.pre-restore.outputs.cache-hit != 'true'
        run: |
          STM32_VENV_PATH=/opt/stm32-venv
          sudo mkdir -p "${STM32_VENV_PATH}"
          sudo chown "$USER" "${STM32_VENV_PATH}"
          python3 -m venv "${STM32_VENV_PATH}"
          "${STM32_VENV_PATH}/bin/python3" -m pip install python-magic==0.4.27
          echo "${STM32_VENV_PATH}/bin" >> "${GITHUB_PATH}"
          echo "STM32_VENV_PATH=${STM32_VENV_PATH}" >> "${GITHUB_ENV}"

      - name: Restore cache – prerequisites
        id: cache-prerequisites
        if: steps.pre-restore.outputs.cache-hit != 'true'
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: build-native/host-libs
          key: ${{ runner.os }}-prerequisites-${{ hashFiles('build-prerequisites.sh', 'build-common.sh', 'src/gmp/**', 'src/mpfr/**', 'src/mpc/**', 'src/isl/**', 'src/expat/**', 'src/zlib*/**') }}

      - name: Build prerequisites (cache miss)
        if: steps.cache-prerequisites.outputs.cache-hit != 'true' && steps.pre-restore.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          JOBS="${JOBS:-$(nproc)}"
          export JOBS
          ./build-prerequisites.sh --skip_steps=mingw,howto,package_sources

      - name: Restore cache – gcc-final
        if: steps.pre-restore.outputs.cache-hit != 'true'
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: install-native
          key: ${{ runner.os }}-stage-v2-${{ needs.compute-hashes.outputs['gcc-final'] }}

      - name: Restore cache – newlib-nano
        if: steps.pre-restore.outputs.cache-hit != 'true'
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: build-native/target-libs
          key: ${{ runner.os }}-stage-v2-${{ needs.compute-hashes.outputs['newlib-nano'] }}

      - name: Restore ccache – gcc-size-libstdcxx
        id: cache-gcc-size-libstdcxx
        if: steps.pre-restore.outputs.cache-hit != 'true'
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-gcc-size-libstdcxx-${{ needs.compute-hashes.outputs['gcc-size-libstdcxx'] }}
          restore-keys: |
            ${{ runner.os }}-ccache-gcc-size-libstdcxx-

      - name: Build and cache stage – gcc-size-libstdcxx
        id: build-gcc-size-libstdcxx
        uses: ./.github/actions/build-stage
        with:
          stage-name: gcc-size-libstdcxx
          cache-paths: |
            install-native
            build-native/target-libs
          cache-key: ${{ runner.os }}-stage-v2-${{ needs.compute-hashes.outputs['gcc-size-libstdcxx'] }}
          build-script: ./build-gcc-size-libstdcxx.sh
          pre-cache-hit: ${{ steps.pre-restore.outputs.cache-hit == 'true' }}
          save-in-merge-group: 'true'

      - name: Report cache sizes – gcc-size-libstdcxx
        id: cache-sizes-gcc-size-libstdcxx
        if: always()
        run: |
          set -euo pipefail
          if [ -d install-native ]; then
            size_human_install=$(du -sh install-native | cut -f1)
            size_bytes_install=$(du -sb install-native | cut -f1)
          else
            size_human_install="(not found)"
            size_bytes_install="0"
          fi
          if [ -d build-native/target-libs ]; then
            size_human_target=$(du -sh build-native/target-libs | cut -f1)
            size_bytes_target=$(du -sb build-native/target-libs | cut -f1)
          else
            size_human_target="(not found)"
            size_bytes_target="0"
          fi
          {
            echo "| Stage | Path | Size |"
            echo "|-------|------|------|"
            echo "| gcc-size-libstdcxx | install-native | ${size_human_install} |"
            echo "| gcc-size-libstdcxx | build-native/target-libs | ${size_human_target} |"
          } >> "${GITHUB_STEP_SUMMARY}"
          {
            echo "cache-size-bytes-install=${size_bytes_install}"
            echo "cache-size-bytes-target=${size_bytes_target}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check ccache directory – gcc-size-libstdcxx
        id: check-ccache-gcc-size-libstdcxx
        if: steps.pre-restore.outputs.cache-hit != 'true' && steps.cache-gcc-size-libstdcxx.outputs.cache-hit != 'true' && github.event_name != 'merge_group'
        run: |
          if [ -d ~/.ccache ] && [ -n "$(ls -A ~/.ccache 2>/dev/null)" ]; then
            echo "non-empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "non-empty=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save ccache – gcc-size-libstdcxx
        if: steps.check-ccache-gcc-size-libstdcxx.outputs.non-empty == 'true'
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-gcc-size-libstdcxx-${{ needs.compute-hashes.outputs['gcc-size-libstdcxx'] }}
  # ---------------------------------------------------------------------------
  # Job: build-final
  # Converges build-gcc-size-libstdcxx and build-gdb.  Restores the
  # gcc-size-libstdcxx snapshot, layers the gdb snapshot on top, then runs
  # the remaining post-build stages (pretidy / strip / specs) and the
  # test_project validation.
  # ---------------------------------------------------------------------------
  build-final:
    needs: [check-changes, compute-hashes, build-binutils, build-gdb, build-gcc-first, build-newlib, build-newlib-nano, build-gcc-final, build-gcc-size-libstdcxx]
    if: needs.check-changes.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo apt-get remove -y \
            '^dotnet-.*' \
            '^llvm-.*' \
            'php.*' \
            azure-cli \
            google-chrome-stable \
            firefox \
            powershell \
            mono-devel \
            || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            yacc \
            flex \
            gcc-arm-none-eabi \
            gdb-multiarch \
            cmake \
            git \
            openocd \
            python3 \
            python3-pip \
            python3-venv \
            texi2html \
            texinfo \
            automake
          for version in 1.15 1.14; do
            for tool in aclocal automake; do
              target="/usr/bin/${tool}-1.16"
              link="/usr/bin/${tool}-${version}"
              if [ -e "$link" ] || [ -L "$link" ]; then
                if [ "$(readlink -f "$link" 2>/dev/null || echo "")" != "$target" ]; then
                  echo "ERROR: $link already exists and does not point to $target" >&2
                  exit 1
                fi
              else
                sudo ln -s "$target" "$link"
              fi
            done
          done

      - name: Set up Python virtual environment
        run: |
          STM32_VENV_PATH=/opt/stm32-venv
          sudo mkdir -p "${STM32_VENV_PATH}"
          sudo chown "$USER" "${STM32_VENV_PATH}"
          python3 -m venv "${STM32_VENV_PATH}"
          "${STM32_VENV_PATH}/bin/python3" -m pip install python-magic==0.4.27
          echo "${STM32_VENV_PATH}/bin" >> "${GITHUB_PATH}"
          echo "STM32_VENV_PATH=${STM32_VENV_PATH}" >> "${GITHUB_ENV}"

      - name: Compute source tree hashes
        id: src-hashes
        run: |
          set -euo pipefail
          toolchain_src_hash=$(
            printf '%s\n' \
              src/binutils \
              src/gcc \
              src/gdb \
              src/newlib \
              src/libiconv \
              src/liblongpath-win32 \
              src/specs \
            | while read -r dir; do
                git rev-parse "HEAD:${dir}"
              done \
            | sha256sum \
            | cut -d' ' -f1
          )
          echo "toolchain-src=${toolchain_src_hash}" >> "${GITHUB_OUTPUT}"

      - name: Restore cache – prerequisites
        id: cache-prerequisites
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: build-native/host-libs
          key: ${{ runner.os }}-prerequisites-${{ hashFiles('build-prerequisites.sh', 'build-common.sh', 'src/gmp/**', 'src/mpfr/**', 'src/mpc/**', 'src/isl/**', 'src/expat/**', 'src/zlib*/**') }}

      - name: Restore cache – toolchain
        id: cache-toolchain
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: install-native
          key: ${{ runner.os }}-toolchain-${{ hashFiles('build-*.sh') }}-${{ steps.src-hashes.outputs.toolchain-src }}

      # Pre-restore: check for a cached final assembly with the same inputs.
      - name: Restore cache – stage-final
        id: pre-restore
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: install-native
          key: ${{ runner.os }}-stage-v2-${{ needs.compute-hashes.outputs.final }}

      # Restore gcc-size-libstdcxx snapshot (full gcc chain output)
      - name: Restore cache – gcc-size-libstdcxx
        if: steps.cache-toolchain.outputs.cache-hit != 'true' && steps.pre-restore.outputs.cache-hit != 'true'
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            install-native
            build-native/target-libs
          key: ${{ runner.os }}-stage-v2-${{ needs.compute-hashes.outputs['gcc-size-libstdcxx'] }}

      # Layer gdb snapshot on top — tar extraction adds gdb binaries without
      # removing gcc/newlib files already present in install-native.
      - name: Restore cache – gdb
        if: steps.cache-toolchain.outputs.cache-hit != 'true' && steps.pre-restore.outputs.cache-hit != 'true'
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: install-native
          key: ${{ runner.os }}-stage-v2-${{ needs.compute-hashes.outputs.gdb }}

      # Run pretidy / strip / specs (all stage builds are skipped)
      - name: Build toolchain – final assembly
        if: steps.cache-toolchain.outputs.cache-hit != 'true' && steps.pre-restore.outputs.cache-hit != 'true'
        run: |
          JOBS=$(nproc)
          export JOBS
          ./build-toolchain.sh \
            --skip_steps=mingw,mingw-gdb-with-python,gdb-with-python,manual,package_sources \
            --skip_stages=binutils,gcc-first,newlib,newlib-nano,gcc-final,gcc-size-libstdcxx,gdb

      - name: Validate cache budget
        run: ./build-cache-budget-check.sh

      - name: Save cache – stage-final
        if: steps.cache-toolchain.outputs.cache-hit != 'true' && steps.pre-restore.outputs.cache-hit != 'true' && github.event_name != 'merge_group'
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: install-native
          key: ${{ runner.os }}-stage-v2-${{ needs.compute-hashes.outputs.final }}

      - name: Report cache sizes – summary
        if: always()
        env:
          BINUTILS_CACHE_SIZES: ${{ needs.build-binutils.outputs.binutils-cache-sizes }}
          GDB_CACHE_SIZES: ${{ needs.build-gdb.outputs.gdb-cache-sizes }}
          GCC_FIRST_CACHE_SIZES: ${{ needs.build-gcc-first.outputs.gcc-first-cache-sizes }}
          NEWLIB_CACHE_SIZES: ${{ needs.build-newlib.outputs.newlib-cache-sizes }}
          NEWLIB_NANO_CACHE_SIZES: ${{ needs.build-newlib-nano.outputs.newlib-nano-cache-sizes }}
          GCC_FINAL_CACHE_SIZES: ${{ needs.build-gcc-final.outputs.gcc-final-cache-sizes }}
          GCC_SIZE_LIBSTDCXX_CACHE_SIZES_INSTALL: ${{ needs.build-gcc-size-libstdcxx.outputs.gcc-size-libstdcxx-cache-sizes-install }}
          GCC_SIZE_LIBSTDCXX_CACHE_SIZES_TARGET: ${{ needs.build-gcc-size-libstdcxx.outputs.gcc-size-libstdcxx-cache-sizes-target }}
        run: |
          format_bytes() {
            local bytes="${1:-}"
            if [ -z "${bytes}" ] || [ "${bytes}" = "0" ]; then
              echo "—"
            else
              echo "${bytes}"
            fi
          }
          {
            echo "## Cache Directory Sizes"
            echo ""
            echo "| Stage | Path | Size (bytes) |"
            echo "|-------|------|-------------|"
            echo "| \`binutils\` | \`install-native\` | $(format_bytes "${BINUTILS_CACHE_SIZES}") |"
            echo "| \`gdb\` | \`install-native\` | $(format_bytes "${GDB_CACHE_SIZES}") |"
            echo "| \`gcc-first\` | \`install-native\` | $(format_bytes "${GCC_FIRST_CACHE_SIZES}") |"
            echo "| \`newlib\` | \`install-native\` | $(format_bytes "${NEWLIB_CACHE_SIZES}") |"
            echo "| \`newlib-nano\` | \`build-native/target-libs\` | $(format_bytes "${NEWLIB_NANO_CACHE_SIZES}") |"
            echo "| \`gcc-final\` | \`install-native\` | $(format_bytes "${GCC_FINAL_CACHE_SIZES}") |"
            echo "| \`gcc-size-libstdcxx\` | \`install-native\` | $(format_bytes "${GCC_SIZE_LIBSTDCXX_CACHE_SIZES_INSTALL}") |"
            echo "| \`gcc-size-libstdcxx\` | \`build-native/target-libs\` | $(format_bytes "${GCC_SIZE_LIBSTDCXX_CACHE_SIZES_TARGET}") |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Save cache – toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true' && github.event_name != 'merge_group'
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: install-native
          key: ${{ steps.cache-toolchain.outputs.cache-primary-key }}

      - name: Build test_project with toolchain
        run: |
          export PATH="${GITHUB_WORKSPACE}/install-native/bin:${PATH}"
          # Verify the toolchain under test is found before invoking cmake
          actual=$(command -v arm-none-eabi-gcc)
          if [[ "${actual}" != "${GITHUB_WORKSPACE}/install-native/bin/arm-none-eabi-gcc" ]]; then
            echo "ERROR: arm-none-eabi-gcc not resolved to install-native/bin (got: ${actual})" >&2
            exit 1
          fi
          arm-none-eabi-gcc --version
          rm -rf test_project/build && mkdir -p test_project/build
          cmake -G "Unix Makefiles" \
            -DCMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/test_project/arm-none-eabi-gcc.cmake" \
            -DCMAKE_C_COMPILER="${GITHUB_WORKSPACE}/install-native/bin/arm-none-eabi-gcc" \
            -DCMAKE_CXX_COMPILER="${GITHUB_WORKSPACE}/install-native/bin/arm-none-eabi-g++" \
            -B test_project/build \
            -S test_project
          cmake --build test_project/build --verbose -- -j "$(nproc)"

      - name: Compare test_project artifacts against reference binaries
        run: |
          set -euo pipefail
          if [ ! -d "test_project/reference" ]; then
            echo "ERROR: test_project/reference directory does not exist."
            exit 1
          fi
          PASS=true
          compared=0
          for ref_file in test_project/reference/*; do
            [ -f "${ref_file}" ] || continue
            # Skip documentation files
            case "${ref_file}" in *.md) continue ;; esac
            # Skip files known to differ between the Windows/CubeIDE reference
            # build and a Linux CI build:
            #   .elf — DWARF debug-info sections embed absolute source/toolchain paths.
            #   .map — linker map contains absolute paths to toolchain library archives.
            #   .hex — Intel HEX encoding can vary between objcopy versions/platforms.
            # Only .bin (raw binary dump of load segments) is a meaningful
            # byte-for-byte check across platforms.
            case "${ref_file}" in *.elf | *.map | *.hex) continue ;; esac
            artifact_name=$(basename "${ref_file}")
            built_file="test_project/build/${artifact_name}"
            if [ ! -f "${built_file}" ]; then
              echo "FAIL: ${artifact_name} not found in build output"
              PASS=false
            elif cmp --silent "${ref_file}" "${built_file}"; then
              echo "PASS: ${artifact_name} matches reference"
            else
              echo "FAIL: ${artifact_name} differs from reference"
              echo "  reference size : $(wc -c < "${ref_file}") bytes"
              echo "  built size     : $(wc -c < "${built_file}") bytes"
              PASS=false
            fi
            compared=$((compared + 1))
          done
          if [ "${compared}" -eq 0 ]; then
            echo "ERROR: No reference artifacts found to compare."
            exit 1
          fi
          if [ "${PASS}" != "true" ]; then
            echo "One or more artifacts differ from the reference binaries."
            exit 1
          fi
          echo "All artifacts match reference binaries."

      - name: Report build times
        if: always()
        env:
          BINUTILS_SECONDS: ${{ needs.build-binutils.outputs.binutils-build-time }}
          BINUTILS_CACHE_HIT: ${{ needs.build-binutils.outputs.binutils-cache-hit }}
          GDB_SECONDS: ${{ needs.build-gdb.outputs.gdb-build-time }}
          GDB_CACHE_HIT: ${{ needs.build-gdb.outputs.gdb-cache-hit }}
          GCC_FIRST_SECONDS: ${{ needs.build-gcc-first.outputs.gcc-first-build-time }}
          GCC_FIRST_CACHE_HIT: ${{ needs.build-gcc-first.outputs.gcc-first-cache-hit }}
          NEWLIB_SECONDS: ${{ needs.build-newlib.outputs.newlib-build-time }}
          NEWLIB_CACHE_HIT: ${{ needs.build-newlib.outputs.newlib-cache-hit }}
          NEWLIB_NANO_SECONDS: ${{ needs.build-newlib-nano.outputs.newlib-nano-build-time }}
          NEWLIB_NANO_CACHE_HIT: ${{ needs.build-newlib-nano.outputs.newlib-nano-cache-hit }}
          GCC_FINAL_SECONDS: ${{ needs.build-gcc-final.outputs.gcc-final-build-time }}
          GCC_FINAL_CACHE_HIT: ${{ needs.build-gcc-final.outputs.gcc-final-cache-hit }}
          GCC_SIZE_LIBSTDCXX_SECONDS: ${{ needs.build-gcc-size-libstdcxx.outputs.gcc-size-libstdcxx-build-time }}
          GCC_SIZE_LIBSTDCXX_CACHE_HIT: ${{ needs.build-gcc-size-libstdcxx.outputs.gcc-size-libstdcxx-cache-hit }}
        run: |
          format_minutes() {
            local seconds="${1:-}"
            if [ -z "${seconds}" ]; then
              echo "—"
            else
              echo "$(( (seconds + 59) / 60 )) min"
            fi
          }
          format_cache_hit() {
            local seconds="${1:-}"
            local cache_hit="${2:-}"
            if [ -z "${seconds}" ]; then
              echo "Yes"
            elif [ "${cache_hit}" = "true" ]; then
              echo "Yes"
            else
              echo "No"
            fi
          }
          {
            echo "## Build Stage Timings"
            echo ""
            echo "| Job | Stage | Build time | Cache hit? |"
            echo "|-----|-------|-----------|-----------|"
            echo "| \`build-binutils\` | III-0 binutils | $(format_minutes "${BINUTILS_SECONDS}") | $(format_cache_hit "${BINUTILS_SECONDS}" "${BINUTILS_CACHE_HIT}") |"
            echo "| \`build-gdb\` | III-6 gdb | $(format_minutes "${GDB_SECONDS}") | $(format_cache_hit "${GDB_SECONDS}" "${GDB_CACHE_HIT}") |"
            echo "| \`build-gcc-first\` | III-1 gcc-first | $(format_minutes "${GCC_FIRST_SECONDS}") | $(format_cache_hit "${GCC_FIRST_SECONDS}" "${GCC_FIRST_CACHE_HIT}") |"
            echo "| \`build-newlib\` | III-2 newlib | $(format_minutes "${NEWLIB_SECONDS}") | $(format_cache_hit "${NEWLIB_SECONDS}" "${NEWLIB_CACHE_HIT}") |"
            echo "| \`build-newlib-nano\` | III-3 newlib-nano | $(format_minutes "${NEWLIB_NANO_SECONDS}") | $(format_cache_hit "${NEWLIB_NANO_SECONDS}" "${NEWLIB_NANO_CACHE_HIT}") |"
            echo "| \`build-gcc-final\` | III-4 gcc-final | $(format_minutes "${GCC_FINAL_SECONDS}") | $(format_cache_hit "${GCC_FINAL_SECONDS}" "${GCC_FINAL_CACHE_HIT}") |"
            echo "| \`build-gcc-size-libstdcxx\` | III-5 gcc-size-libstdcxx | $(format_minutes "${GCC_SIZE_LIBSTDCXX_SECONDS}") | $(format_cache_hit "${GCC_SIZE_LIBSTDCXX_SECONDS}" "${GCC_SIZE_LIBSTDCXX_CACHE_HIT}") |"
          } >> "${GITHUB_STEP_SUMMARY}"

  # ---------------------------------------------------------------------------
  # Status job – keep required checks green when jobs are skipped.
  # ---------------------------------------------------------------------------
  build-status:
    runs-on: ubuntu-slim
    needs: [check-changes, compute-hashes, build-binutils, build-gdb, build-gcc-first, build-newlib, build-newlib-nano, build-gcc-final, build-gcc-size-libstdcxx, build-final]
    if: always()
    steps:
      - name: Report build status
        run: |
          if [[ "${{ needs.check-changes.result }}" == "failure" || "${{ needs.check-changes.result }}" == "cancelled" ]]; then
            echo "check-changes job failed or was cancelled" && exit 1
          fi
          if [[ "${{ needs.compute-hashes.result }}" == "failure" || "${{ needs.compute-hashes.result }}" == "cancelled" ]]; then
            echo "compute-hashes failed or was cancelled" && exit 1
          fi
          if [[ "${{ needs.build-binutils.result }}" == "failure" || "${{ needs.build-binutils.result }}" == "cancelled" ]]; then
            echo "build-binutils failed or was cancelled" && exit 1
          fi
          if [[ "${{ needs.build-gdb.result }}" == "failure" || "${{ needs.build-gdb.result }}" == "cancelled" ]]; then
            echo "build-gdb failed or was cancelled" && exit 1
          fi
          if [[ "${{ needs.build-gcc-first.result }}" == "failure" || "${{ needs.build-gcc-first.result }}" == "cancelled" ]]; then
            echo "build-gcc-first failed or was cancelled" && exit 1
