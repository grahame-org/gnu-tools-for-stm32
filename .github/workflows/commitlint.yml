name: Lint Commit Messages

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions: {}

jobs:
  commitlint:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Smoke test commitlint configuration
        run: |
          # Verify that all conventional commit types used in this repository are accepted.
          # This acts as a regression test when @commitlint/config-conventional is updated.
          valid_messages=(
            "feat: add new feature"
            "fix: correct a bug"
            "docs: update documentation"
            "style: reformat code"
            "refactor: restructure code"
            "test: add unit tests"
            "chore: maintenance task"
            "ci: update workflow"
            "build: upgrade dependency"
            "perf: improve performance"
            "revert: revert a commit"
            "feat(scope): add scoped feature"
            "fix!: breaking bug fix"
          )
          for msg in "${valid_messages[@]}"; do
            if ! printf '%s\n' "$msg" | npx --no-install commitlint --verbose; then
              echo "FAIL: expected valid message was rejected: ${msg}"
              exit 1
            fi
          done

          # Verify that messages without a valid conventional-commits type are rejected.
          invalid_messages=(
            "WIP: work in progress"
            "update stuff without type"
          )
          for msg in "${invalid_messages[@]}"; do
            # Capture combined stdout+stderr so we can distinguish a clean lint failure
            # (e.g. type-empty/type-enum) from a tool crash or configuration error.
            output=$(printf '%s\n' "$msg" | npx --no-install commitlint --verbose 2>&1)
            status=$?
            if [ "$status" -eq 0 ]; then
              echo "FAIL: expected invalid message was accepted: ${msg}"
              echo "commitlint output:"
              printf '%s\n' "$output"
              exit 1
            fi
            if ! printf '%s\n' "$output" | grep -Eq 'type-(enum|empty)'; then
              echo "FAIL: invalid message did not fail due to expected type rule: ${msg}"
              echo "commitlint output:"
              printf '%s\n' "$output"
              exit 1
            fi
          done

      - name: Validate PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx --no-install commitlint --verbose

      - name: Validate merge queue commit message
        if: github.event_name == 'merge_group'
        env:
          COMMIT_MSG: ${{ github.event.merge_group.head_commit.message }}
        run: printf '%s\n' "$COMMIT_MSG" | npx --no-install commitlint --verbose
