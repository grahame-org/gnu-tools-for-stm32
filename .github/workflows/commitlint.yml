name: Lint Commit Messages

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions: {}

jobs:
  commitlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx --no-install commitlint --verbose

      - name: Validate merge queue commit message
        if: github.event_name == 'merge_group'
        env:
          COMMIT_MSG: ${{ github.event.merge_group.head_commit.message }}
        run: printf '%s\n' "$COMMIT_MSG" | npx --no-install commitlint --verbose
