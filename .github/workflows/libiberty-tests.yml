name: Libiberty Unit Tests

on:
  push:
    branches:
      - 13.3.rel1
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  check-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should-test: ${{ steps.filter.outputs.test || 'true' }}
    steps:
      - name: Check for test-relevant file changes
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            test:
              - 'src/binutils/**'
              - 'build-toolchain.sh'
              - 'build-prerequisites.sh'
              - 'build-common.sh'
              - '.github/workflows/libiberty-tests.yml'

  libiberty-tests:
    needs: check-changes
    if: needs.check-changes.outputs.should-test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Configure libiberty
        run: |
          mkdir -p build/libiberty
          cd build/libiberty
          ../../src/binutils/libiberty/configure

      - name: Build libiberty
        run: make -C build/libiberty -j$(nproc)

      - name: Run libiberty tests
        run: |
          # Failure-detection mechanism:
          # - configure sets CHECK=really-check for standalone builds (no --with-target-subdir),
          #   so 'make check' expands to 'make really-check' via Makefile.in's 'check: @CHECK@'
          # - really-check runs 6 test targets: check-cplus-dem, check-d-demangle,
          #   check-rust-demangle (all using test-demangle), check-pexecute,
          #   check-expandargv, and check-strtol; each test binary exits non-zero on failure
          # - make exits non-zero when any recipe command fails, propagating the failure
          # - set -o pipefail ensures make's non-zero exit propagates through the tee
          #   pipeline so this step (and the CI job) correctly fails on test failures
          set -o pipefail
          mkdir -p build/libiberty/testsuite
          make -C build/libiberty check 2>&1 | tee build/libiberty/testsuite/libiberty-tests.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: libiberty-test-results
          path: build/libiberty/testsuite/*.log

  libiberty-tests-status:
    runs-on: ubuntu-latest
    needs: [check-changes, libiberty-tests]
    if: always()
    steps:
      - name: Report test status
        run: |
          if [[ "${{ needs.check-changes.result }}" == "failure" || "${{ needs.check-changes.result }}" == "cancelled" ]]; then
            echo "check-changes job failed or was cancelled" && exit 1
          fi
          if [[ "${{ needs.libiberty-tests.result }}" == "failure" || "${{ needs.libiberty-tests.result }}" == "cancelled" ]]; then
            echo "Tests failed or were cancelled" && exit 1
          fi
          echo "Tests skipped or succeeded"
