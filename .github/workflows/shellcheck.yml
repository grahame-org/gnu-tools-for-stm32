name: ShellCheck

on:
  push:
    branches:
      - 13.3.rel1
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

jobs:
  check-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should-test: ${{ steps.filter.outputs.test || 'true' }}
    steps:
      - name: Check for test-relevant file changes
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            test:
              - 'build-binutils.sh'
              - 'build-cache-budget-check.sh'
              - 'build-common.sh'
              - 'build-gcc-first.sh'
              - 'build-gdb.sh'
              - 'build-newlib.sh'
              - 'build-newlib-nano.sh'
              - 'build-pre-cache-clean.sh'
              - 'build-prerequisites.sh'
              - 'build-toolchain-args.sh'
              - 'build-toolchain.sh'
              - 'measure-cache-compressed-size.sh'
              - '.github/actions/build-stage/*.sh'
              - 'tests/test-build-stage-action.sh'
              - 'tests/test-build-stage-scripts.sh'
              - 'tests/test-helpers.sh'
              - '.shellcheckrc'
              - '.github/workflows/shellcheck.yml'

  shellcheck:
    needs: check-changes
    if: needs.check-changes.outputs.should-test == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run shellcheck on build scripts
        run: |
          shellcheck --severity=warning \
          build-binutils.sh \
          build-common.sh \
          build-gcc-first.sh \
          build-gdb.sh \
          build-newlib.sh \
          build-newlib-nano.sh \
          build-pre-cache-clean.sh \
          build-prerequisites.sh \
          build-toolchain-args.sh \
          build-toolchain.sh \
          build-cache-budget-check.sh \
          measure-cache-compressed-size.sh \
          tests/test-build-stage-action.sh \
          tests/test-build-stage-scripts.sh \
          tests/test-helpers.sh \
          .github/actions/build-stage/clean-before-cache-save.sh \
          .github/actions/build-stage/compute-cache-miss.sh \
          .github/actions/build-stage/run-build-stage.sh \
          .github/actions/build-stage/set-cache-hit-output.sh

  shellcheck-status:
    runs-on: ubuntu-latest
    needs: [check-changes, shellcheck]
    if: always()
    steps:
      - name: Report shellcheck status
        run: |
          if [[ "${{ needs.check-changes.result }}" == "failure" || "${{ needs.check-changes.result }}" == "cancelled" ]]; then
            echo "check-changes job failed or was cancelled" && exit 1
          fi
          if [[ "${{ needs.shellcheck.result }}" == "failure" || "${{ needs.shellcheck.result }}" == "cancelled" ]]; then
            echo "ShellCheck failed or was cancelled" && exit 1
          fi
          echo "ShellCheck skipped or succeeded"
