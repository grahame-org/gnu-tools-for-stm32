name: ShellCheck

on:
  push:
    branches:
      - 13.3.rel1
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

jobs:
  check-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should-test: ${{ steps.filter.outputs.test || 'true' }}
    steps:
      - name: Check for test-relevant file changes
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            test:
              - 'build-binutils.sh'
              - 'build-common.sh'
              - 'build-gcc-first.sh'
              - 'build-prerequisites.sh'
              - 'build-toolchain-args.sh'
              - 'build-toolchain.sh'
              - '.github/actions/build-stage/*.sh'
              - '.shellcheckrc'
              - '.github/workflows/shellcheck.yml'

  shellcheck:
    needs: check-changes
    if: needs.check-changes.outputs.should-test == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run shellcheck on build scripts
        run: |
          shellcheck --severity=warning \
          build-binutils.sh \
          build-common.sh \
          build-gcc-first.sh \
          build-prerequisites.sh \
          build-toolchain-args.sh \
          build-toolchain.sh \
          .github/actions/build-stage/run-build-stage.sh

  shellcheck-status:
    runs-on: ubuntu-latest
    needs: [check-changes, shellcheck]
    if: always()
    steps:
      - name: Report shellcheck status
        run: |
          if [[ "${{ needs.check-changes.result }}" == "failure" || "${{ needs.check-changes.result }}" == "cancelled" ]]; then
            echo "check-changes job failed or was cancelled" && exit 1
          fi
          if [[ "${{ needs.shellcheck.result }}" == "failure" || "${{ needs.shellcheck.result }}" == "cancelled" ]]; then
            echo "ShellCheck failed or was cancelled" && exit 1
          fi
          echo "ShellCheck skipped or succeeded"
