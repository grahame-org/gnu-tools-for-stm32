name: GDB Regression Tests

on:
  push:
    branches:
      - 13.3.rel1
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  gdb-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        test-group:
          - name: gdb.dwarf2
            tests: "gdb.dwarf2/*.exp"
            # debug-names tests use get_func_info with -nostartfiles, which
            # fails to link on arm-none-eabi 13.2.1 / newlib 4.4 because
            # libg.a references _fini that is only provided by crtn.o (a
            # startup file).  Skip them so the rest of gdb.dwarf2 can run.
            ignore: >-
              --ignore=debug-names.exp
              --ignore=debug-names-bad-cu-index.exp
              --ignore=debug-names-non-ascending-cu.exp
              --ignore=debug-names-tu.exp
              --ignore=debug-names-tu-dwarf5.exp
          - name: gdb.arch
            tests: "gdb.arch/*.exp"
            # arm-bl-branch-dest.exp links its test binary at 0xb0000000,
            # which mps2-an385 has no memory mapped for.  The CPU enters
            # LOCKUP, GDB never sees a breakpoint hit, and the test times out.
            ignore: "--ignore=arm-bl-branch-dest.exp"
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            yacc \
            flex \
            git \
            dejagnu \
            texinfo \
            automake \
            gcc-arm-none-eabi \
            qemu-system-arm \
            libgmp-dev \
            libmpfr-dev

      - name: Configure GDB
        run: |
          mkdir -p build/gdb
          cd build/gdb
          ../../src/gdb/configure \
            --target=arm-none-eabi \
            --disable-nls \
            --disable-werror \
            --disable-sim \
            --disable-binutils \
            --disable-gas \
            --disable-ld \
            --disable-gold \
            --disable-gprof

      - name: Build GDB
        run: make -C build/gdb -j$(nproc) all-gdb

      - name: Run GDB regression tests
        run: |
          make -C build/gdb/gdb check \
            RUNTESTFLAGS="--target_board=qemu ${{ matrix.test-group.ignore }}" \
            TESTS="${{ matrix.test-group.tests }}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: gdb-test-results-${{ matrix.test-group.name }}
          path: |
            build/gdb/**/*.sum
            build/gdb/**/*.log
