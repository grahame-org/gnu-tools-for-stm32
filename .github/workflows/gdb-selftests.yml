name: GDB Selftests

on:
  push:
    branches:
      - 13.3.rel1
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  check-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should-test: ${{ steps.filter.outputs.test || 'true' }}
    steps:
      - name: Check for test-relevant file changes
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            test:
              - 'src/gdb/**'
              - 'build-toolchain.sh'
              - 'build-prerequisites.sh'
              - 'build-common.sh'
              - '.github/workflows/gdb-selftests.yml'

  gdb-selftests:
    needs: check-changes
    if: needs.check-changes.outputs.should-test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgmp-dev \
            libmpfr-dev \
            libreadline-dev \
            texinfo \
            flex \
            bison

      - name: Configure GDB for host
        run: |
          mkdir -p build/gdb
          cd build/gdb
          ../../src/gdb/configure \
            --disable-nls \
            --disable-werror \
            --enable-unit-tests \
            --with-python=no

      - name: Build GDB
        run: make -C build/gdb all-gdb -j"$(nproc)"

      - name: Run GDB selftests
        run: |
          set -o pipefail
          build/gdb/gdb/gdb --batch -ex "maintenance selftest" 2>&1 | tee gdb-selftest-results.txt
          ! grep -q "Self test failed:" gdb-selftest-results.txt

      - name: Upload selftest results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: gdb-selftest-results
          path: gdb-selftest-results.txt

  gdb-selftests-status:
    runs-on: ubuntu-latest
    needs: [check-changes, gdb-selftests]
    if: always()
    steps:
      - name: Report test status
        run: |
          if [[ "${{ needs.check-changes.result }}" == "failure" || "${{ needs.check-changes.result }}" == "cancelled" ]]; then
            echo "check-changes job failed or was cancelled" && exit 1
          fi
          if [[ "${{ needs.gdb-selftests.result }}" == "failure" || "${{ needs.gdb-selftests.result }}" == "cancelled" ]]; then
            echo "Tests failed or were cancelled" && exit 1
          fi
          echo "Tests skipped or succeeded"
