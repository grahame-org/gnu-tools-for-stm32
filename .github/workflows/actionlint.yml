name: actionlint

on:
  push:
    branches:
      - 13.3.rel1
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

jobs:
  check-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should-lint: ${{ steps.filter.outputs.lint || 'true' }}
    steps:
      - name: Check for lint-relevant file changes
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            lint:
              - '.github/workflows/**'

  actionlint:
    needs: check-changes
    if: needs.check-changes.outputs.should-lint == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.11
          echo "${HOME}/go/bin" >> "${GITHUB_PATH}"

      - name: Run actionlint on workflow files
        run: |
          # Find all workflow YAML files, excluding:
          # - *.lock.yml      — auto-generated agentic workflow lock files
          # - agentics-maintenance.yml — auto-generated by pkg/workflow/maintenance_workflow.go; DO NOT EDIT
          mapfile -t workflow_files < <(find .github/workflows -maxdepth 1 -name '*.yml' ! -name '*.lock.yml' ! -name 'agentics-maintenance.yml' | sort)
          if [[ ${#workflow_files[@]} -eq 0 ]]; then
            echo "No workflow files found to lint"
            exit 0
          fi
          echo "Linting ${#workflow_files[@]} workflow file(s):"
          printf '  %s\n' "${workflow_files[@]}"
          actionlint "${workflow_files[@]}"

  actionlint-status:
    runs-on: ubuntu-latest
    needs: [check-changes, actionlint]
    if: always()
    steps:
      - name: Report actionlint status
        run: |
          if [[ "${{ needs.check-changes.result }}" == "failure" || "${{ needs.check-changes.result }}" == "cancelled" ]]; then
            echo "check-changes job failed or was cancelled" && exit 1
          fi
          if [[ "${{ needs.actionlint.result }}" == "failure" || "${{ needs.actionlint.result }}" == "cancelled" ]]; then
            echo "actionlint failed or was cancelled" && exit 1
          fi
          echo "actionlint skipped or succeeded"
