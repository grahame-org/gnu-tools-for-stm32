name: Avo Generator Check

on:
  push:
    branches:
      - 13.3.rel1
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

jobs:
  check-changes:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should-test: ${{ steps.filter.outputs.test || 'true' }}
    steps:
      - name: Check for test-relevant file changes
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            test:
              - 'src/gcc/libgo/go/crypto/ed25519/internal/edwards25519/field/_asm/**'
              - '.github/workflows/avo-generator-check.yml'

  avo-generator-check:
    needs: check-changes
    if: needs.check-changes.outputs.should-test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: src/gcc/libgo/go/go.mod
          # go.sum is not committed for this generator-only module; disable
          # setup-go's built-in cache to avoid a cache-key lookup failure.
          cache: false

      - name: Download avo dependencies
        # go.sum is not committed; go mod tidy downloads dependencies and
        # creates go.sum so that subsequent go build / go run commands work
        # under Go 1.16+ module sum verification.
        working-directory: src/gcc/libgo/go/crypto/ed25519/internal/edwards25519/field/_asm
        run: go mod tidy

      - name: Verify avo generator compiles
        working-directory: src/gcc/libgo/go/crypto/ed25519/internal/edwards25519/field/_asm
        run: go build .

      - name: Run avo generator and verify output is stable
        working-directory: src/gcc/libgo/go/crypto/ed25519/internal/edwards25519/field/_asm
        run: |
          # Generate with the real output filenames so that the path embedded
          # in the "Code generated by command:" header matches the committed file.
          go run . \
            -out ../fe_amd64.s \
            -stubs ../fe_amd64.go \
            -pkg field
          # Verify the generated Go stubs match the committed stubs.
          if ! git diff --exit-code ../fe_amd64.go; then
            echo "ERROR: avo generated different Go stubs than those committed."
            echo "The committed fe_amd64.go may need to be regenerated with:"
            echo "  cd src/gcc/libgo/go/crypto/ed25519/internal/edwards25519/field/_asm"
            echo "  go generate"
            git checkout -- ../fe_amd64.go
            rm -f ../fe_amd64.s
            exit 1
          fi
          # fe_amd64.s is not committed in this repository so it cannot be
          # compared; any assembly regression would surface as a build failure
          # when libgo is compiled. The stubs check above is sufficient to
          # detect avo API changes that alter the public interface.
          rm -f ../fe_amd64.s

  avo-generator-check-status:
    runs-on: ubuntu-slim
    needs: [check-changes, avo-generator-check]
    if: always()
    steps:
      - name: Report check status
        run: |
          if [[ "${{ needs.check-changes.result }}" == "failure" || "${{ needs.check-changes.result }}" == "cancelled" ]]; then
            echo "check-changes job failed or was cancelled" && exit 1
          fi
          if [[ "${{ needs.avo-generator-check.result }}" == "failure" || "${{ needs.avo-generator-check.result }}" == "cancelled" ]]; then
            echo "Avo generator check failed or was cancelled" && exit 1
          fi
          echo "Avo generator check skipped or succeeded"
