name: 'STM32 Toolchain'
description: 'Run commands using the arm-none-eabi GNU toolchain for STM32 from a pre-built Docker container'
author: 'grahame-org'

inputs:
  run:
    description: 'Command to run inside the container'
    required: true

runs:
  using: 'docker'
  # Pin to the latest semver release; release-please keeps this tag in sync.
  image: 'docker://ghcr.io/grahame-org/stm32-toolchain-13.3.rel1:v0.0.0'  # x-release-please-version
  entrypoint: '/bin/sh'
  args:
    - '-c'
    - ${{ inputs.run }}

branding:
  icon: 'cpu'
  color: 'blue'
